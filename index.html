<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umacalc</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e13; --panel:#11161f; --panel2:#151b26; --line:#212a38; --line2:#2c3646;
  --tx:#e6ebf2; --sub:#9aa6b8; --mut:#697588;
  --blue:#4d9fff; --bluebg:rgba(77,159,255,.10);
  --gold:#b08d3f;
  --green:#2fd583; --greenbg:rgba(47,213,131,.10);
  --red:#f4655f;   --redbg:rgba(244,101,95,.10);
  --amber:#f0a832; --amberbg:rgba(240,168,50,.10);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 80px}
a{color:var(--blue)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px}
.head{font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.muted{color:var(--mut);font-size:12px}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.scroll{overflow-x:auto}
.pos{color:var(--green)} .neg{color:var(--red)}

label,.lbl{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;
           letter-spacing:.08em;margin-bottom:4px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=checkbox]{width:auto;accent-color:var(--blue);margin:0 6px 0 0;vertical-align:middle}
button{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;
  padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--blue);color:#fff}
button.primary{background:var(--blue);border-color:var(--blue);color:#04101f;font-weight:600}
button.primary:hover{background:#69b0ff;color:#04101f}
button.danger{color:var(--red);border-color:rgba(244,101,95,.35)}
button.danger:hover{background:var(--redbg);border-color:var(--red)}
button.small{padding:4px 10px;font-size:12px}
button.x{padding:1px 7px;font-size:12px;color:var(--mut)}
.err{color:var(--red);font-size:12px;margin-top:5px}
.okmsg{color:var(--green);font-size:12px;margin-top:5px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}
.fields>div{display:flex;flex-direction:column}
.fields>div>label{margin-top:auto}

.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.metric .k{font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.metric .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;line-height:1.25}

.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 9px;
      border-radius:999px;text-transform:uppercase}
.pill.info{background:var(--bluebg);color:var(--blue);border:1px solid rgba(77,159,255,.3)}
.pill.warn{background:var(--amberbg);color:var(--amber);border:1px solid rgba(240,168,50,.3)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:13px}
.banner.red{background:var(--redbg);border:1px solid rgba(244,101,95,.4);color:var(--red)}
.banner.amber{background:var(--amberbg);border:1px solid rgba(240,168,50,.4);color:var(--amber)}

.calbox{background:var(--bluebg);border:1px solid rgba(77,159,255,.28);border-radius:11px;padding:12px 15px;margin:0 0 12px}
.calans{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--blue)}
.calsub{font-size:12.5px;color:var(--sub);margin-top:4px}
.calsub b{color:var(--gold);font-weight:700}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;
   padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--mono)}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--blue)}
th.sorted{color:var(--blue)}
tr.off td{opacity:.55}
tr.sel td{color:var(--gold)}
tr.sorted td{background:var(--bluebg)}

.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
       align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modalcard{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
           padding:18px 22px;max-width:740px;width:100%;max-height:86vh;overflow:auto}

.vbar{color:var(--gold);font-weight:700;padding:0 6px}

/* --- app --- */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand span{color:var(--gold)}
.totop{position:fixed;right:22px;bottom:22px;z-index:40;width:42px;height:42px;padding:0;border-radius:50%;
       display:flex;align-items:center;justify-content:center;color:var(--blue);background:var(--panel2);
       border:1px solid rgba(77,159,255,.45);box-shadow:0 6px 18px rgba(0,0,0,.45);
       opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.totop:hover{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
.brand .beta{font-style:normal;font-size:12px;font-weight:600;color:var(--amber);letter-spacing:.04em;vertical-align:middle}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a.end{margin-left:auto}
.tt .nm{font-size:14px}
.grow{display:inline-flex;gap:6px;white-space:nowrap}
.grow>span{display:inline-flex;gap:3px;min-width:34px}
.gl{color:var(--mut)}
.gz{color:var(--mut)}
.tfrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
/* filter groups: the summary is the button, the body drops down over the page instead of growing the row */
details.fgrp{position:relative;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);padding:0;margin:0;min-width:140px}
details.fgrp summary{font-size:12.5px;color:var(--sub);padding:7px 10px;border-radius:8px}
details.fgrp:hover{border-color:var(--blue)}
details.fgrp:hover summary{color:var(--tx)}
details.fgrp[open]{border-color:rgba(77,159,255,.5);background:var(--bluebg)}
details.fgrp[open] summary{color:var(--blue)}
.fpop{position:absolute;top:calc(100% + 4px);left:-1px;z-index:30;min-width:calc(100% + 2px);background:var(--panel2);
      border:1px solid rgba(77,159,255,.5);border-radius:8px;padding:4px 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
.fbody{display:flex;gap:4px 12px;margin-top:6px;align-items:center}
select:hover{border-color:var(--blue)}
select:disabled:hover{border-color:var(--line2)}
.ctr{text-align:center}
.mtitle{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.msub{font-size:14px;color:var(--sub);margin-bottom:12px}
.kv{font-size:13px;color:var(--tx);margin-top:4px}
a.ext{font-size:11.5px;font-weight:600;text-transform:none;letter-spacing:0;margin-left:8px;text-decoration:none;white-space:nowrap}
a.ext:hover{text-decoration:underline}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mpic{width:96px;height:96px;flex:none;margin:-6px -4px 0 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
table.cmp th,table.cmp td{padding-left:6px;padding-right:6px}
table.cmp .gs{padding-left:16px}
/* target toggle: an empty ring, filled blue when on */
.tgl{width:18px;height:18px;padding:0;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel2);vertical-align:middle}
.tgl:hover{border-color:var(--blue)}
.tgl.on{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--panel2),0 0 0 3px var(--bluebg)}
.row.fill>div{flex:1 1 auto}
.row.fill table{width:100%}
.jpt{font-family:var(--mono);font-size:10.5px;color:var(--sub)}
table.pot th.pl{text-align:center;border-bottom:1px solid var(--line)}
table.pot td:nth-child(even),table.pot th.pl,table.pot tr:last-child th:nth-child(odd){padding-left:16px}
label.ck{display:inline-flex;align-items:center;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--tx);margin:0;cursor:pointer}
nav a{padding:6px 12px;border-radius:8px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;border:1px solid transparent}
nav a:hover{color:var(--tx);border-color:var(--line2)}
nav a.on{color:var(--blue);background:var(--bluebg);border-color:rgba(77,159,255,.3)}
select.mini,input.mini{width:auto;padding:3px 6px;font-size:12px;border-radius:6px}
input.mini{width:62px}
.nm{color:var(--tx);cursor:pointer;font-weight:600;text-decoration:none}
.nm:hover{color:var(--blue)}
.ttl{font-size:11px;color:var(--mut)}
.g{display:inline-block;width:18px;text-align:center;font-family:var(--mono);font-weight:700}
.gS{color:var(--gold)} .gA{color:var(--tx)} .gB{color:var(--sub);font-weight:600} .gC{color:var(--mut);font-weight:500}
.gD,.gE,.gF,.gG{color:#465062;font-weight:400}
th.apt span{display:inline-block;width:18px;text-align:center;letter-spacing:0}
td.apt,th.apt{padding-left:4px;padding-right:4px;white-space:nowrap}
.ty{font-family:var(--mono);font-size:11px;color:var(--sub);text-transform:uppercase}
.gold{color:var(--gold)}
.mono{font-family:var(--mono)}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:10px 0}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.slot.fr{border-style:dashed}
.slot select{font-size:12px;padding:5px 6px}
.slot .meta{font-size:11px;color:var(--mut);margin-top:4px;font-family:var(--mono)}
.quota{display:grid;grid-template-columns:repeat(7,minmax(44px,64px));gap:6px}
.quota input{padding:4px 6px;text-align:center;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub)}
.chips .gold{font-weight:600}
.dist td.dh{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
            padding-top:12px;border-bottom:1px solid var(--line2)}
.bench{font-size:11.5px;color:var(--mut)}
.ace{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid rgba(176,141,63,.55);border-radius:999px;
     font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);vertical-align:1px}
.pinrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.pinrow .nm{flex:1;min-width:0}
.pinrow select{margin-left:auto}
.pinrow label.pace{margin-left:auto;font-size:12px;color:var(--sub)}
.pinrow label.pace+select{margin-left:0}
.pinrow select{width:auto}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* planner trainee rows: targets on line 1, hint targets on line 2, items spanning both */
table.ptab tr.pu1 td{border-bottom:0;padding-bottom:2px}
table.ptab tr.pu2 td{padding-top:2px;padding-bottom:10px}
table.ptab .pitems{vertical-align:top;width:260px;min-width:260px;max-width:260px;padding-top:4px}
table.ptab th.pitems{vertical-align:bottom;padding-bottom:0}
table.ptab th.grp{text-align:center;border-bottom:1px solid var(--line)}
table.sub{width:100%;table-layout:fixed;font-size:12px}
table.sub td,table.sub th{border:0;padding:1px 0 1px 4px;line-height:1.5}
table.sub th{letter-spacing:.04em}
table.sub td:first-child,table.sub th:first-child{padding-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sub th{padding-bottom:6px}
/* the hint cells are fixed width so the trainee column can end exactly where the third begins */
.hrow{display:flex;flex-wrap:wrap;gap:6px 10px}
/* justified: every cell grows from zero toward an equal share but never below its own name, so short names take the slack */
.hcell{display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-width:max-content}
.hcell select{min-width:110px}
.hcell.off{opacity:.45}
.hcell .ttl{white-space:nowrap}
/* the trainee column is as wide as the first listed trainee's first two skills (alignPlanner sets --pname), so Stars starts where its third skill does; the target columns shrink to fit and the filler column takes the slack */
table.ptab td.pname{width:var(--pname,244px);min-width:var(--pname,244px);max-width:var(--pname,244px)}
table.ptab .fit{width:1%;white-space:nowrap}
table.ptab .fill{padding:0}
/* collapsible planner sections: the card header is the toggle; collapsed drops only its trailing margin */
details.sect{border-top:0;padding:0;margin:0}
details.sect>summary.head{font-size:10.5px;color:var(--sub);font-weight:700;margin-bottom:10px}
details.sect>summary.head:hover{color:var(--tx)}
details.sect:not([open])>summary.head{margin-bottom:0}
details.sect>summary .sbtn{margin-left:12px;padding:2px 10px;font-size:11px;letter-spacing:.04em;text-transform:none;vertical-align:middle}
details.sect:not([open])>summary .sbtn{display:none}
/* planner filter panel: a fixed four-across grid */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px}
label.ck.pf{align-items:flex-start;font-weight:400;min-width:0}
label.ck.pf input{margin-top:3px}
label.ck.pf>span{display:flex;flex-direction:column;min-width:0}
.pfn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
label.ck.pf .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
hr.rule{border:0;border-top:2px solid var(--line2);margin:14px 0 8px}
@media(max-width:660px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.igrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.igrid label{text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600;color:var(--sub);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 24px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
table.invt tr.sech td{padding-top:10px;border-bottom:1px solid var(--line2)}
table.invt tr.hr td{padding:6px 0 0;border-bottom:2px solid var(--line2)}
/* "i" helper: a small blue circle; its explanation appears above it on hover or focus */
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:4px;
     border:1px solid rgba(77,159,255,.55);border-radius:50%;color:var(--blue);font:700 9px/1 var(--sans);text-transform:none;
     letter-spacing:0;cursor:help;vertical-align:1px;outline:none}
.tip:hover,.tip:focus{background:var(--bluebg);border-color:var(--blue)}
.tip::after{content:attr(data-tip);position:absolute;left:-8px;bottom:calc(100% + 8px);z-index:60;width:240px;padding:8px 10px;
     background:var(--panel2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);
     color:var(--tx);font:400 12px/1.45 var(--sans);text-align:left;white-space:normal;
     opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip:hover::after,.tip:focus::after{opacity:1;transform:none}
.wiperow{justify-content:flex-end;margin-top:4px}
/* column-title bubbles: open below the title (the table's scroll box would clip one above);
   number columns anchor right so the bubble stays inside the table */
th.hastip{position:relative}
th .sort2{color:var(--mut);opacity:.7}
th.hastip::after{content:attr(data-tip);position:absolute;top:calc(100% + 4px);left:0;z-index:60;width:230px;padding:8px 10px;
     background:var(--panel2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);
     color:var(--tx);font:400 12px/1.45 var(--sans);text-transform:none;letter-spacing:0;text-align:left;white-space:normal;
     opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .12s .25s,transform .12s .25s}
th.hastip.num::after{left:auto;right:0}
th.hastip:hover::after{opacity:1;transform:none}
.sfields{grid-template-columns:repeat(auto-fill,minmax(130px,150px))}
table.swt{width:auto}
table.swt td input{width:72px;padding:4px 6px;font-family:var(--mono);text-align:right}
/* trials */
.ttline,.ttgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ttline>div{display:flex;flex-direction:column;gap:5px}
.ttline select{flex:1;min-width:0}
.ttslot{display:flex;align-items:center;gap:4px}
.ttslot .mono{font-size:11px}
.ttrow{display:flex;align-items:center;gap:5px;margin-top:5px}
.ttrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.ttrow input{width:76px;text-align:right;font-family:var(--mono)}
.ttrow input.pl{width:38px}
.spark{display:block}
button.sparkb{padding:2px 3px;background:none;border-color:transparent;border-radius:6px;display:block}
button.sparkb:hover{border-color:var(--blue);background:var(--bluebg)}
button.small.on{color:var(--blue);background:var(--bluebg);border-color:rgba(77,159,255,.5)}
.chart{display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--mut)}
.chart .gr{stroke:var(--line)}
.chart .ax{stroke:var(--line2)}
.chart .ma{fill:none;stroke:var(--sub);stroke-width:2}
.chart .pt{fill:var(--gold)}
.legend{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.legend i{display:inline-block}
.legend .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.legend .dot.na{background:none;border:1.5px solid var(--gold);width:5px;height:5px;margin-left:10px}
.chart .pt.na{fill:var(--panel);stroke:var(--gold);stroke-width:1.5}
.chart .aceband{fill:var(--gold);opacity:.09}
.chart .acech{stroke:var(--gold);stroke-dasharray:3 3;opacity:.6}
button.acet{width:20px;height:20px;padding:0;border-radius:50%;font-size:10px;font-weight:700;color:var(--mut);flex:none}
/* lineup ace buttons: hover bubble below, anchored right so the Dirt column's stays on screen */
button.acet[data-tip]{position:relative}
button.acet[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;z-index:60;width:240px;padding:8px 10px;
     background:var(--panel2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);
     color:var(--tx);font:400 12px/1.45 var(--sans);letter-spacing:0;text-align:left;white-space:normal;
     opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .12s .25s,transform .12s .25s}
button.acet[data-tip]:hover::after{opacity:1;transform:none}
.ttline>div:first-child button.acet::after{right:auto;left:-6px}
@media(max-width:900px){.ttline>div:nth-child(odd) button.acet::after{right:auto;left:-6px}}
.ttrow button.acet{width:18px;height:18px;font-size:9.5px}
button.acet.on{color:var(--gold);border-color:rgba(176,141,63,.7);background:rgba(176,141,63,.12)}
.legend .line{width:16px;height:2px;background:var(--sub);margin-left:10px}
tr.tot td{font-weight:700;border-top:1px solid var(--line2)}
.pill.good{background:var(--greenbg);color:var(--green);border:1px solid rgba(47,213,131,.3)}
.pill.bad{background:var(--redbg);color:var(--red);border:1px solid rgba(244,101,95,.3)}
.pill.mute{background:var(--panel2);color:var(--mut);border:1px solid var(--line2)}
@media(max-width:900px){.ttline,.ttgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,340px));justify-content:start;gap:18px}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Uma<span>calc</span> <em class="beta">(BETA)</em></div>
    <nav id="nav"></nav>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <footer class="muted" id="foot"></footer>
</div>
<div class="modal" id="modal"><div class="modalcard" id="modalcard"></div></div>
<button class="totop" id="totop" aria-label="Back to top"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<script src="data.js"></script>
<script>
"use strict";
const VERSION = "0.7";
const D = window.UMA_DATA;
const TODAY = new Date().toISOString().slice(0, 10);
const NOW = Date.now() / 1000;
const KEY = "umacalc.v1", SCHEMA = 1;

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const opts = (list, cur) => list.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(l)}</option>`).join("");
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const fN = v => Math.round(v).toLocaleString();
const day = t => new Date(t * 1000).toISOString().slice(0, 10);

/* ---------------- static data ---------------- */
const UMAS = D.umas, UBY = {};
UMAS.forEach(u => UBY[u.id] = u);
const SUPS = D.sups, SBY = {};
SUPS.forEach(s => SBY[s.id] = s);

const TYPES = [["speed","Spd"],["stamina","Sta"],["power","Pow"],["guts","Gut"],["intelligence","Wit"],["friend","Frd"],["group","Grp"]];
const TYPE_LBL = Object.fromEntries(TYPES);
const RAR = ["", "R", "SR", "SSR"];
const STAT = ["Spd", "Sta", "Pow", "Gut", "Wit"];
const GRADES = "SABCDEFG";
const STAR_SHARDS = [0, 0, 50, 100, 200, 300];     // cost to reach star i from i-1
// Hint level of a potential skill (P2..P5 unlock one each), max Lv3. Cost of each step
// [item, n]: Book 160 / Textbook 161 for normal skills, Rare Book 162 / Rare Textbook 163
// for rare ones, plus Dream Glimmer 44. From JP guides; Monies are left out (only Lv1 is known).
const HINT_MAX = 3;
const HINT_COST = {
  n: [[[160, 4], [44, 5]],  [[160, 8], [44, 10]],  [[161, 6], [44, 15]]],
  r: [[[162, 8], [44, 20]], [[162, 16], [44, 40]], [[163, 12], [44, 60]]],
};
const HINT_ITEMS = [160, 161, 162, 163];
// Hint-able skills: innate ones (open from the start) then potential skills (P2..P5).
// Levels are stored by skill id: {skillId: level}.
const hintSkills = u => u.in.map(sk => ({sk, unlock: 1})).concat(u.aw.map((sk, k) => ({sk, unlock: k + 2})));
const hLv = (h, sk) => (h && h[sk]) || 0;
function hintCost(skill, from, to, into = {}) {
  const steps = HINT_COST[skGold(skill) ? "r" : "n"];
  for (let l = from; l < to; l++) for (const [id, n] of steps[l]) into[id] = (into[id] || 0) + n;
  return into;
}
// Max level a card can reach at each limit break.
const LVCAP = {1: [20,25,30,35,40], 2: [25,30,35,40,45], 3: [30,35,40,45,50]};
// The breakpoints GameTora's effect arrays are keyed on; -1 means "not set here".
const LV_PTS = [1,5,10,15,20,25,30,35,40,45,50];

// Team Trials: five races, three runners each. Aptitude string order is
// Turf Dirt | Sprint Mile Medium Long | Front Pace Late End.
// w = stat weights [Spd, Sta, Pow, Gut, Wit] for base stats and growth alike. Wit carries
// +0.2 everywhere: skills activate on wit, and Team Trials points come largely from skills.
const DISTS = [
  {n: "Sprint", surf: 0, dist: 2, w: [1, 0, 1, .5, .7]},
  {n: "Mile",   surf: 0, dist: 3, w: [1, .2, 1, .3, .8]},
  {n: "Medium", surf: 0, dist: 4, w: [1, .6, .8, .3, .7]},
  {n: "Long",   surf: 0, dist: 5, w: [.8, 1.2, .6, .4, .7]},
  {n: "Dirt",   surf: 1, dist: 3, w: [1, .2, 1.2, .4, .6]},
];
const STYLES = [{n: "Front", i: 6}, {n: "Pace", i: 7}, {n: "Late", i: 8}, {n: "End", i: 9}];

// Team-building settings, editable on the Settings tab (root.cfg). The defaults and why:
// - g: grade factor, roughly how hard a grade is to raise to A by inheritance. One B is a single
//   common spark away, so it's cheap; C needs the same aptitude raised twice. D–G are next to unusable; they only matter when
//   Lowest aptitude is set that low or for a pinned trainee.
// - fix: every further aptitude below A costs this on top, because the parents then have to carry
//   several different sparks at once. Two Bs ≈ .74, three ≈ .58, B+C ≈ .47.
// - pref: a preferred trainee wins a slot it is within this many points of; about one B.
// - grow / base: weight of growth % and of base stats. Growth multiplies every training gain for
//   the whole career, so a fitting 20% is worth about one B; base stats are a light tiebreak.
// - w: per-race stat weights [Spd, Sta, Pow, Gut, Wit] (see DISTS).
// - ttN / ttRisk: Trials log window (last N matches) and how hard spread counts against a
//   trainee when ranking who to replace (average − ttRisk × std dev).
// - ttMA: matches in the trend chart's moving average.
// - ttAce: the ace bonus % already inside entered scores; taken back out before runners are compared
//   for the ace role (0 if scores are entered before the bonus).
// - skN / skG: points per own skill tied to the slot's distance, style or surface (normal / gold or
//   unique). A trainee with two Mile skills scores a few points more in Mile; about a B at most.
// - skU: points per 100 Team Trials points a unique activation is worth above a 1★'s (UNIQ_PTS),
//   counted wherever the unique can fire. Default 1: a 5★ gets +7, a 3★ +5 over a 1★.
const CFG_DEF = {g: {S: 1.03, A: 1, B: .93, C: .6, D: .3, E: .1, F: .05, G: .02}, fix: .85, pref: 8, grow: .6, base: .25, skN: 1.5, skG: 3, ttN: 15, ttRisk: .5, ttMA: 8, skU: 1, ttAce: 10,
                 w: DISTS.map(d => d.w.slice())};
const cfg = () => root.cfg;
function cfgNorm(c) {
  const d = JSON.parse(JSON.stringify(CFG_DEF));
  if (!c || typeof c !== "object") return d;
  const num = (v, def) => typeof v === "number" && isFinite(v) && v >= 0 ? v : def;
  for (const g in d.g) d.g[g] = num(c.g && c.g[g], d.g[g]);
  for (const k of ["fix", "pref", "grow", "base", "skN", "skG", "ttN", "ttRisk", "ttMA", "skU", "ttAce"]) d[k] = num(c[k], d[k]);
  d.w = d.w.map((row, di) => row.map((v, i) => num(c.w && c.w[di] && c.w[di][i], v)));
  return d;
}

// Rough per-unit value of each support effect, for ranking cards against each other.
// Friendship and training effectiveness dominate; a flat stat bonus is worth a few points.
const W = {1:1, 2:.2, 3:4, 4:4, 5:4, 6:4, 7:4, 8:1.2, 9:.05, 10:.05, 11:.05, 12:.05, 13:.05,
           14:.15, 15:.5, 16:.02, 17:1.5, 18:.08, 19:.15, 25:.1, 26:.1, 27:.1, 28:.15, 30:.3, 31:2, 32:.02, 41:4};
const COND_UNIQUE = 6;   // conditional unique effects aren't modelled; credit them flat
const EFF_PCT = new Set([1,2,8,15,16,18,25,26,27,28]);

/* ---------------- state ---------------- */
function blank() {
  return {schema: SCHEMA, umas: {}, tgt: {}, sups: {}, decks: [], inv: {on: {}, shards: {}}, cfg: cfgNorm(null), tt: ttNorm(null),
          team: {pins: [], prefs: [], excl: [], minG: "B", alts: 8},
          plan: {umas: {}, sups: {}, inv: {}, skills: [], open: {}, show: {}},
          set: {jp: false}};
}
function normDeck(d) {
  d.name = d.name || "Deck";
  if (!Array.isArray(d.cards)) d.cards = [];
  d.cards = d.cards.slice(0, 5);
  while (d.cards.length < 5) d.cards.push(null);
  if (d.friend === undefined) d.friend = null;
  if (d.flb == null) d.flb = 4;
  if (d.tr === undefined) d.tr = null;
  if (!d.q) d.q = {speed: 2, stamina: 1, power: 1, guts: 0, intelligence: 1, friend: 0, group: 0};
  return d;
}
function normalize(r) {
  const b = blank();
  if (!r || typeof r !== "object") r = {};
  for (const k in b) {
    if (r[k] == null || typeof r[k] !== typeof b[k] || Array.isArray(r[k]) !== Array.isArray(b[k])) r[k] = b[k];
  }
  for (const k of ["team", "plan", "set", "inv"]) for (const kk in b[k]) if (r[k][kk] == null) r[k][kk] = b[k][kk];
  r.decks.forEach(normDeck);
  // The global "Force must include into ace role" setting (on by default) became a per-pin Ace
  // tick on 2026-10-18; carry it over to pins saved before then.
  const wasForced = !(r.cfg && r.cfg.forceAce === false);
  r.team.pins.forEach(p => { if (typeof p.ace !== "boolean") p.ace = wasForced; });
  r.cfg = cfgNorm(r.cfg);
  r.tt = ttNorm(r.tt);
  for (const id in r.tgt) if (r.umas[id]) delete r.tgt[id];
  // Pins lock a race only (2026-10-17); clear any style lock saved before that.
  r.team.pins.forEach(p => { p.s = null; });
  // Hint levels were briefly stored as a 4-slot array of potential skills; now {skillId: lv}.
  for (const src of [r.umas, r.plan.umas]) for (const id in src) {
    const x = src[id], u = UBY[id];
    if (x && Array.isArray(x.h)) x.h = u ? Object.fromEntries(u.aw.map((sk, k) => [sk, x.h[k] || 0]).filter(e => e[1])) : {};
  }
  r.schema = SCHEMA;
  return r;
}
let saveErr = "", loadNote = "";
function load() {
  try {
    const s = localStorage.getItem(KEY);
    return normalize(s ? JSON.parse(s) : null);
  } catch (e) {
    saveErr = "Browser storage is unavailable (" + e.message + "). Changes will not survive a reload — export a backup from Data.";
    return normalize(null);
  }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(root));
    if (saveErr) { saveErr = ""; drawBanner(); }
    return true;
  } catch (e) {
    saveErr = "Not saved — browser storage refused the write (" + e.message + "). Export a backup from Data before closing this tab.";
    drawBanner();
    return false;
  }
}
let root = load();
const UI = {tq: "", tShow: [], tShowAll: false, tSort: [["name", 1]], ttSort: [["race", 1]], ttRole: "all",
            tf: {surf: {on: [], g: "A", any: false, open: false},
                 dist: {on: [], g: "A", any: false, open: false},
                 sty:  {on: [], g: "A", any: false, open: false},
                 show: {open: false}},
            sq: "", sType: "", sRar: "", sOwn: "all", sSort: [["score", -1]],
            team: null, teamIdx: 0, hq: ""};

const avail = x => root.set.jp || (!!x.en && x.en <= TODAY);
// Out in JP but not yet on Global: listed on Trainees so it can be targeted, never owned.
const jpOnly = x => !avail(x) && !!x.jp && x.jp <= TODAY;

// Global release estimate. Global works through JP's back catalogue faster than JP
// released it (the gap was ~1580 days at launch and keeps shrinking), so fit Global
// date against JP date over the last year of Global releases and extrapolate.
const DAY = 86400000;
const estGlobal = (() => {
  const pts = UMAS.concat(SUPS).filter(x => x.en && x.jp && x.en <= TODAY).map(x => [Date.parse(x.jp), Date.parse(x.en)]);
  const last = Math.max(...pts.map(p => p[1]));
  const rec = pts.filter(p => p[1] >= last - 365 * DAY);
  const mx = rec.reduce((a, p) => a + p[0], 0) / rec.length, my = rec.reduce((a, p) => a + p[1], 0) / rec.length;
  const b = rec.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / rec.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
  const floor = Date.parse(TODAY) + DAY;
  return jp => new Date(Math.max(floor, my + b * (Date.parse(jp) - mx))).toISOString().slice(0, 10);
})();

/* ---------------- trainee helpers ---------------- */
const uStats = (u, star) => u.s[star] || u.s[u.r];
const uStar = u => (root.umas[u.id] || {}).s || 0;
function ownedUmas() {
  return Object.keys(root.umas).map(id => UBY[id]).filter(u => u && avail(u));
}
const gr = g => `<span class="g g${g}">${g}</span>`;
const aptTd = (u, a, b) => `<td class="apt">${[...u.a.slice(a, b)].map(gr).join("")}</td>`;
const APT_TH = `<th class="apt"><span>Tf</span><span>Dt</span></th><th class="apt"><span>Sp</span><span>Mi</span><span>Md</span><span>Lg</span></th><th class="apt"><span>Fr</span><span>Pc</span><span>Lt</span><span>En</span></th>`;
const GROW = ["Sp", "St", "Po", "Gu", "Wi"];
const growth = u => `<span class="grow">${u.g.map((v, i) => `<span><span class="gl">${GROW[i]}</span>${v ? `<span class="gold">${v}</span>` : `<span class="gz">–</span>`}</span>`).join("")}</span>`;
// A trainee's or card's own GameTora page, opened in a new tab. (GameTora has no per-skill
// page, so skill names aren't linked; see OPEN-ITEMS.)
const gtLink = (kind, slug) => slug
  ? ` <a class="ext" href="https://gametora.com/umamusume/${kind}/${encodeURIComponent(slug)}" target="_blank" rel="noopener">GameTora ↗</a>` : "";
// Potential items: shoes first, then sashes, then Dream Glimmer.
const itemOrder = id => (+id <= 13 ? 0 : +id === 44 ? 2 : 1) * 1000 + +id;
const uName = u => `<a class="nm" data-act="uinfo" data-id="${u.id}">${esc(u.n)}</a><div class="ttl">${esc(u.t)}</div>${jpOnly(u) ? `<div class="jpt">JP · est ${estGlobal(u.jp)}</div>` : ""}`;

/* ---------------- support helpers ---------------- */
function effAt(arr, lv) {
  let pi = -1, ni = -1;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === -1) continue;
    if (LV_PTS[i] <= lv) pi = i; else if (ni < 0) ni = i;
  }
  if (pi < 0) return 0;
  if (LV_PTS[pi] === lv || ni < 0) return arr[pi];
  return Math.floor(arr[pi] + (arr[ni] - arr[pi]) * (lv - LV_PTS[pi]) / (LV_PTS[ni] - LV_PTS[pi]));
}
const maxLv = (s, lb) => LVCAP[s.r][lb];
function supEff(s, lv) {
  const o = {};
  for (const k in s.ef) { const v = effAt(s.ef[k], lv); if (v) o[k] = v; }
  let cond = false;
  if (s.u && lv >= s.u.lv) for (const [t, v] of s.u.ef) {
    if (t < 100) { if (v) o[t] = (o[t] || 0) + v; } else cond = true;
  }
  return {o, cond};
}
function supScore(s, lv) {
  const {o, cond} = supEff(s, lv);
  let t = cond ? COND_UNIQUE : 0;
  for (const k in o) t += (W[k] || 0) * o[k];
  return t;
}
const own = s => root.sups[s.id];
const curLv = s => { const o = own(s); return o ? Math.min(o.lv || maxLv(s, o.lb), maxLv(s, o.lb)) : maxLv(s, 4); };
function ownedSups() { return Object.keys(root.sups).map(id => SBY[id]).filter(s => s && avail(s)); }
const sName = s => `<a class="nm" data-act="sinfo" data-id="${s.id}">${esc(s.n)}</a><div class="ttl">${esc(s.t)}</div>`;
const sLabel = (s, lb) => `${s.n} ${RAR[s.r]}` + (lb != null ? ` LB${lb}` : "") + ` · ${s.t}`;
const statPlus = o => (o[3] || 0) + (o[4] || 0) + (o[5] || 0) + (o[6] || 0) + (o[7] || 0) + (o[41] || 0) * 5;
const skName = id => (D.skills[id] || ["#" + id])[0];
const skGold = id => (D.skills[id] || [0, 1])[1] >= 2;
function banners(b) {
  let last = null, next = null;
  for (const [t, est] of b) {
    if (t <= NOW) last = t; else if (!next) next = [t, est];
  }
  return {last: last ? day(last) : "", next: next ? day(next[0]) + (next[1] ? " est" : "") : ""};
}

/* ---------------- nav / shell ---------------- */
const TABS = [["trainees","Trainees"],["supports","Supports"],["planner","Planner"],["inventory","Inventory"],["teams","Teams"],["trials","Trials"],["decks","Decks"],["aces","Aces"],["parents","Parents"],["hints","Hint Sources"],["settings","Settings"],["data","Data"]];
const VIEWS = {};
let tab = "trainees";
// Tabs that are scaffolding only: flagged so nobody plans around them yet.
const WIP = new Set(["supports", "decks", "aces", "parents", "hints", "inventory"]);
// What each tab owns, for its red "Delete … data" button: label, what the confirm lists, and the
// wipe itself. Shared stores are split by owner: Planner keeps targets and its filter, Inventory
// keeps item and shard counts (Planner's Owned column reads them), Hint Sources keeps its skill
// list. Teams keeps its lists; Lowest aptitude and Alternatives belong to Settings.
const WIPE = {
  trainees:  ["Delete Trainees data", "owned trainees, their stars, potential and hint levels, and targets", r => { r.umas = {}; r.tgt = {}; }],
  supports:  ["Delete Supports data", "owned support cards, limit breaks and levels", r => { r.sups = {}; }],
  planner:   ["Delete Planner data", "star, potential, hint and card targets, and the trainee filter", r => { r.plan.umas = {}; r.plan.sups = {}; r.plan.show = {}; }],
  inventory: ["Delete Inventory data", "item counts, shard counts and the trainee switches", r => { r.plan.inv = {}; r.inv = {on: {}, shards: {}}; }],
  teams:     ["Delete Teams data", "the Must include, Prefer and Exclude lists", r => { r.team.pins = []; r.team.prefs = []; r.team.excl = []; }],
  trials:    ["Delete Trials data", "the lineup, every recorded match, trained-copy numbers and settled replacements", r => { const s = r.tt.seeded; r.tt = ttNorm(null); r.tt.seeded = s; }],
  decks:     ["Delete Decks data", "every deck", r => { r.decks = []; }],
  hints:     ["Delete Hint Sources data", "the tracked skill list", r => { r.plan.skills = []; }],
  settings:  ["Reset settings", "every team-building and Trials setting, back to its default", r => { r.cfg = cfgNorm(null); r.team.minG = "B"; r.team.alts = 8; }],
};
function show() {
  VIEWS[tab]();
  if (WIP.has(tab)) view.insertAdjacentHTML("afterbegin", `<div class="banner amber">Under construction · not for current use</div>`);
  if (WIPE[tab]) view.insertAdjacentHTML("beforeend", `<div class="row wiperow"><button class="small danger" data-act="wipe" data-k="${tab}">${WIPE[tab][0]}</button></div>`);
}
function go() {
  const h = location.hash.slice(1);
  tab = TABS.some(t => t[0] === h) ? h : "trainees";
  $("nav").innerHTML = TABS.map(([k, n]) => `<a href="#${k}" class="${k === tab ? "on" : ""}${k === "settings" ? " end" : ""}">${n}</a>`).join("");
  show();
}
function drawBanner() {
  $("banner").innerHTML = (saveErr ? `<div class="banner red">${esc(saveErr)}</div>` : "") +
    (loadNote ? `<div class="banner amber">${esc(loadNote)}</div>` : "");
}
const view = $("view");

/* ---------------- sorting with memory ---------------- */
// Each sortable table keeps its last few sorts, newest first: the newest sets the order and the
// earlier ones break its ties. So "vs Race" then "Race" groups by race with vs Race inside each.
// Array.sort is stable, so whatever is still tied keeps the list's own order.
const SORT_DEPTH = 3;
function sortBy(list, keys, valueOf) {
  const cmp = (x, y) => x < y ? -1 : x > y ? 1 : 0;
  return list.sort((a, b) => { for (const [k, d] of keys) { const c = cmp(valueOf(a, k), valueOf(b, k)) * d; if (c) return c; } return 0; });
}
// Header cell: the main sort gets an arrow; the remembered ones a faint arrow. quiet hides the
// arrow for a table's resting order (Trials in lineup order).
function sortHead(keys, tab, k, label, cls = "", attrs = "", quiet = false) {
  const pos = keys.findIndex(x => x[0] === k), d = pos >= 0 ? keys[pos][1] : 0, hush = quiet && pos === 0 && d > 0 && keys.length === 1;
  const arrow = pos < 0 || hush ? "" : pos === 0 ? (d > 0 ? " ▴" : " ▾") : ` <span class="sort2">${d > 0 ? "▴" : "▾"}</span>`;
  return `<th data-sort="${k}" data-tab="${tab}"${attrs} class="${cls}${pos === 0 && !hush ? " sorted" : ""}">${label}${arrow}</th>`;
}

/* ---------------- Trainees ---------------- */
// Aptitude filter groups: indices into the aptitude string.
// Surface has no All/Any switch: a trainee good on both turf and dirt is rare enough that
// checking both means "both".
const TF = [
  {k: "surf", n: "Surface",  any: false, items: [["Turf", 0], ["Dirt", 1]]},
  {k: "dist", n: "Distance", any: true,  items: [["Sprint", 2], ["Mile", 3], ["Medium", 4], ["Long", 5]]},
  {k: "sty",  n: "Style",    any: true,  items: [["Front", 6], ["Pace", 7], ["Late", 8], ["End", 9]]},
];
// No trainee has a natural S, so the threshold starts at A.
const TF_GRADES = [..."ABCDEFG"].map(x => [x, x + "+"]);
const tfSum = g => {
  const f = UI.tf[g.k];
  if (!f.on.length) return "";
  return g.items.filter(([, i]) => f.on.includes(i)).map(([n]) => n).join(f.any ? " / " : " + ") + " " + f.g + "+";
};
// Show categories overlap on purpose (a JP-only trainee is also Not owned); ticked ones are OR'd.
const SHOW = {own: u => !!root.umas[u.id], not: u => !root.umas[u.id], tgt: u => !!root.tgt[u.id], jp: u => jpOnly(u)};
const SHOW_L = [["own", "Owned"], ["not", "Not owned"], ["tgt", "Target"], ["jp", "JP only"]];

      return `<div class="slot${fr ? " fr" : ""}"><label>${fr ? "Friend" : j + 1}</label>${sel}<div class="meta">${meta}</div></div>`;
    };

      ${warn.length ? `<div class="banner amber">${warn.map(esc).join(" · ")}</div>` : ""}
      <div class="statrow">${m("", "Score", f1(score) + (cond ? "*" : ""))}${m(1, "Friend", tot[1] || 0)}${m(8, "Train", tot[8] || 0)}${m(2, "Mood", tot[2] || 0)}${m(15, "Race", tot[15] || 0)}${m(19, "Spec", tot[19] || 0)}${m(0, "Stat+", statPlus(tot))}</div>
      <div class="hint mono">${TYPES.filter(([t]) => types[t]).map(([t, l]) => `${l} ${types[t]}`).join('<span class="vbar">|</span>')}</div>
      <details><summary>Hints · ${hl.length}</summary><div class="chips">${hl.map(h => `<span class="${skGold(h) ? "gold" : ""}">${esc(skName(h))}${hints.get(h) > 1 ? " ×" + hints.get(h) : ""}</span>`).join("")}</div></details>
    </div>`;
  }).join("");
}
function autoDeck(d) {
  const used = new Set();
  const tr = d.tr && UBY[d.tr];
  if (tr) used.add(tr.c);
  const need = {...d.q};
  for (const id of d.cards.concat(d.friend)) {
    const s = id && SBY[id];
    if (!s) continue;
    used.add(s.c);
    if (id !== d.friend) need[s.ty] = (need[s.ty] || 0) - 1;
  }
  const pool = ownedSups().map(s => ({s, sc: supScore(s, curLv(s))})).sort((a, b) => b.sc - a.sc);
  for (let i = 0; i < 5; i++) {
    if (d.cards[i]) continue;
    const pick = pool.find(p => !used.has(p.s.c) && need[p.s.ty] > 0) || pool.find(p => !used.has(p.s.c));
    if (!pick) break;
    d.cards[i] = pick.s.id; used.add(pick.s.c); need[pick.s.ty] = (need[pick.s.ty] || 0) - 1;
  }
  if (!d.friend) {
    // Borrow the strongest card of the type the mix leans on most.
    const main = TYPES.map(t => t[0]).sort((a, b) => (d.q[b] || 0) - (d.q[a] || 0))[0];
    const best = SUPS.filter(s => avail(s) && s.r === 3 && s.ty === main && !used.has(s.c))
      .map(s => ({s, sc: supScore(s, maxLv(s, d.flb))})).sort((a, b) => b.sc - a.sc)[0];
    if (best) d.friend = best.s.id;
  }
}

/* ---------------- Teams ---------------- */
function slotFit(u, star, di, si, minG) {
  const d = DISTS[di];
  const g = [u.a[d.surf], u.a[d.dist], u.a[STYLES[si].i]];
  const lim = GRADES.indexOf(minG);
  if (g.some(x => GRADES.indexOf(x) > lim)) return null;
  const c = cfg();
  let m = g.reduce((p, x) => p * (c.g[x] || 0), 1);
  const fixes = g.filter(x => GRADES.indexOf(x) > 1).length;
  if (fixes > 1) m *= c.fix ** (fixes - 1);
  // A pinned trainee (minG "G") is placed even on an unusable aptitude; it just scores near zero.
  if (m <= 0) { if (minG !== "G") return null; m = .05; }
  // Sparks: grade steps short of A, i.e. how much inheritance it takes to make the slot comfortable.
  const sp = g.reduce((n, x) => n + Math.max(0, GRADES.indexOf(x) - 1), 0);
  const st = uStats(u, star), w = c.w[di];

  if (!x || typeof x !== "object") return d;

    const v = x.lineup[di] && x.lineup[di][k]; return UBY[v] ? v : null; }));

        <td class="num">${off(r.offAll)}</td><td class="num">${off(r.offRace)}</td>
        <td class="num">${r.s && r.s.n > 1 ? n(r.s.sd) : ""}</td><td class="num">${r.s && r.s.n > 1 ? (r.s.cv * 100).toFixed(0) + "%" : ""}</td>
        <td class="num">${r.s ? n(r.s.hi) : ""}</td><td class="num">${r.s ? n(r.s.lo) : ""}</td>
        <td>${sparkBtn(r, "sc", spark(r.es.map(e => e.sc)))}</td><td class="num">${r.p ? r.p.m.toFixed(2) : ""}</td><td class="num">${r.topPct == null ? "" : r.topPct.toFixed(0) + "%"}</td>
        <td>${sparkBtn(r, "pl", spark(r.pls, true))}</td><td class="num${rk === 1 ? " gold" : ""}">${rk || ""}</td></tr>`; }).join("") || `<tr><td colspan="16" class="muted">—</td></tr>`}</tbody></table>`;
  // Races and team, per match, over the last N matches.
  const last = R.slice(-N);
  const rs = DISTS.map((d, di) => ({d, s: stat(last.filter(r => r.e.some(e => e.di === di)).map(r => raceTotal(r, di))),
    p: stat(last.flatMap(r => r.e.filter(e => e.di === di && e.pl).map(e => e.pl)))}));
  const rm = rs.filter(x => x.s).map(x => x.s.m), rlo = Math.min(...rm), rhi = Math.max(...rm), ts = stat(last.map(teamTotal));
  $("ttRaces").innerHTML = `<div class="head">Races<span class="vbar">|</span>Last ${N}</div>
    <table><thead><tr><th>Race</th><th class="num">Avg</th><th class="num">Norm</th><th class="num">SD</th><th class="num">High</th><th class="num">Low</th><th class="num">Place</th></tr></thead><tbody>
    ${rs.map(x => `<tr><td>${x.d.n}</td><td class="num gold">${x.s ? n(x.s.m) : ""}</td><td class="num">${x.s && rhi > rlo ? ((x.s.m - rlo) / (rhi - rlo) * 100).toFixed(1) + "%" : ""}</td>
      <td class="num">${x.s && x.s.n > 1 ? n(x.s.sd) : ""}</td><td class="num">${x.s ? n(x.s.hi) : ""}</td><td class="num">${x.s ? n(x.s.lo) : ""}</td><td class="num">${x.p ? x.p.m.toFixed(2) : ""}</td></tr>`).join("")}
    ${ts ? `<tr class="tot"><td>Team</td><td class="num gold">${n(ts.m)}</td><td></td><td class="num">${ts.n > 1 ? n(ts.sd) : ""}</td><td class="num">${n(ts.hi)}</td><td class="num">${n(ts.lo)}</td><td></td></tr>` : ""}</tbody></table>`;
  // Replacements: the replaced trainee's last N matches in that race against the newcomer's
  // matches since, and the same windows for the race total and the whole team (placement bonuses
  // mean a swap can lift or sink teammates too).
  // Accepted or reverted swaps drop out of the table; "Settled" shows them again, dimmed.
  const ch = ttChanges(), nDone = ch.filter(chDone).length;
  const sw = ch.map((c, i) => {
    const st = chDone(c);
    if (st && !UI.ttSettled) return "";
    const next = ch.slice(i + 1).find(x => x.di === c.di), nextAt = next ? next.at : R.length;
    const same = c.out === c.in, who = `${vName(c.out, c.ov, same)} → ${vName(c.in, c.nv, same)}`, key = esc(chKey(c));
    const act = st ? `<span class="pill mute">${st === "a" ? "Accepted" : "Reverted"}</span>${root.tt.done[chKey(c)] && c.revertedAt == null ? ` <button class="small" data-act="ttundo" data-key="${key}">Undo</button>` : ""}`
      : `<button class="small" data-act="ttok" data-key="${key}">Accept</button> <button class="small" data-act="ttrev" data-key="${key}"${revSlot(c) < 0 ? ` disabled title="${esc(UBY[c.in].n)} is no longer in this slot, or ${esc(UBY[c.out].n)} is running elsewhere"` : ""}>Revert</button>`;
    if (c.revert) return `<tr class="off"><td class="num">${c.at + 1}</td><td>${DISTS[c.di].n}</td><td>${who}</td>
      <td colspan="9"><span class="pill mute">Revert</span> <span class="muted">undoes match ${c.revert.at + 1}</span></td><td></td></tr>`;
    // The trainee test uses every match: before = all the outgoing copy's matches in this race,
    // reaching back past any revert (a reverted swap means it was never really gone); after = all
    // matches since, up to the race's next swap. A trained copy doesn't change, so old matches
    // count as much as new ones, and the inflation-free relative scores cancel score drift.
    // The raw figures (Before/After, Race Δ, Team Δ, Place) stay on N either side, since raw
    // scores drift up over time.
    const beforeAll = R.slice(0, c.at).filter(r => r.e.some(e => e.id === c.out && e.di === c.di && (e.v || 1) === c.ov));
    const afterAll = ttRange(c.at, nextAt), before = beforeAll.slice(-N), after = afterAll.slice(0, N);
    const a = ttOf(before, c.out, c.di, c.ov), b = ttOf(after, c.in, c.di, c.nv);
    const ar = relOf(beforeAll, c.out, c.di, c.ov), br = relOf(afterAll, c.in, c.di, c.nv);
    const v = verdict(ar, br), need = needMore(ar, br);
    const needTxt = v === "Better" || v === "Worse" || need === undefined ? "" : need === null ? "can't confirm" : need > 100 ? "100+" : need ? `~${need}` : "";
    const ra = before.map(r => raceTotal(r, c.di)), rb = after.map(r => raceTotal(r, c.di));
    const ta = before.map(teamTotal), tb = after.map(teamTotal);
    const sa = stat(a.map(e => e.sc)), sb = stat(b.map(e => e.sc));
    const pa = stat(a.filter(e => e.pl).map(e => e.pl)), pb = stat(b.filter(e => e.pl).map(e => e.pl));
    return `<tr${st ? ' class="off"' : ""}><td class="num">${c.at + 1}</td><td>${DISTS[c.di].n}</td><td>${who}</td>
      <td class="num">${sa ? n(sa.m) : ""}<span class="muted"> ${sa ? sa.n : ""}</span></td><td class="num">${sb ? n(sb.m) : ""}<span class="muted"> ${sb ? sb.n : ""}</span></td>
      <td class="num" title="${ar.length} matches before · ${br.length} after">${ar.length && br.length ? fPct(pct(stat(ar).m, stat(br).m)) : ""}</td>
      <td>${vPill(v)}${c.revertedAt ? ` <span class="muted">reverted at ${c.revertedAt + 1}</span>` : ""}</td><td class="num muted">${needTxt}</td>
      <td class="num">${ra.length && rb.length ? fPct(pct(stat(ra).m, stat(rb).m)) : ""}</td>
      <td class="num">${ta.length && tb.length ? fPct(pct(stat(ta).m, stat(tb).m)) : ""}</td><td>${vPill(verdict(ta, tb))}</td>
      <td class="num">${pa && pb ? `${pa.m.toFixed(2)} → ${pb.m.toFixed(2)}` : ""}</td><td style="white-space:nowrap">${act}</td></tr>`;
  }).reverse().join("");
  $("ttSwaps").innerHTML = `<div class="head" style="display:flex;align-items:center">Replacements
      ${nDone ? `<button class="small${UI.ttSettled ? " on" : ""}" style="margin-left:auto" data-act="ttsettled">Settled · ${nDone}</button>` : ""}</div>
    <table><thead><tr><th class="num">Match</th><th>Race</th><th>Out → In</th><th class="num">Before</th><th class="num">After</th><th class="num" title="Share of teammates' average, so score inflation cancels. Uses every match before and after the swap; the trainee test and Need use the same.">Δ adj</th><th>Trainee</th><th class="num">Need</th>
      <th class="num">Race Δ</th><th class="num">Team Δ</th><th>Team</th><th class="num">Place</th><th></th></tr></thead><tbody>${sw || `<tr><td colspan="13" class="muted">—</td></tr>`}</tbody></table>`;
  // Match log, newest first.
  // Collapsible like the Planner's sections (state kept in root.plan.open under "ttLog").
  $("ttLog").innerHTML = sect("ttLog", `Matches<span class="vbar">|</span>${R.length}`, `
    <table><thead><tr><th class="num">#</th><th>Date</th><th class="num">Team</th>${DISTS.map(d => `<th class="num">${d.n}</th>`).join("")}<th></th></tr></thead><tbody>
    ${R.map((r, i) => `<tr${UI.ttEdit === i ? ' class="sorted"' : ""}><td class="num">${i + 1}</td><td class="mono">${r.t ? new Date(r.t).toISOString().slice(0, 10) : ""}</td>
      <td class="num gold">${n(teamTotal(r))}</td>${DISTS.map((d, di) => { const was = i && aceOf(R[i - 1], di), now = aceOf(r, di);
        return `<td class="num">${was && now && was !== now ? `<span class="ace" style="margin:0 6px 0 0" title="Ace: ${esc(UBY[was].n)} → ${esc(UBY[now].n)}">A</span>` : ""}${n(raceTotal(r, di))}</td>`; }).join("")}
      <td><button class="small" data-act="ttedit" data-i="${i}">Edit</button> <button class="x" data-act="ttdel" data-i="${i}">×</button></td></tr>`).reverse().join("") || `<tr><td colspan="9" class="muted">—</td></tr>`}</tbody></table>`);
}
// Entry form: 15 rows of score + placement. A new match takes the current lineup; editing an old
// one keeps that match's own trainees.
function drawTtEntry(msgText) {
  const R = root.tt.rounds, edit = UI.ttEdit != null && R[UI.ttEdit];
  // The ace defaults to the lineup's first slot (or the saved match's ace) and can be changed per match.
  const src = edit ? edit.e : DISTS.flatMap((d, di) => root.tt.lineup[di].map((id, k) => id && {id, di, sc: "", pl: "", a: k === 0 ? 1 : 0}));
  const ready = src.length === 15 && src.every(Boolean);
  const fmt = v => v === "" || v == null ? "" : String(v);
  $("ttEntry").innerHTML = `<div class="head">${edit ? `Edit match ${UI.ttEdit + 1}` : "Add match"}</div>
    ${ready ? `<div class="ttgrid">${DISTS.map((d, di) => `<div><div class="lbl">${d.n}</div>
      ${src.map((e, j) => e.di === di ? `<div class="ttrow"><button class="acet${e.a ? " on" : ""}" tabindex="-1" data-act="ttace" data-di="${di}" data-j="${j}" title="Ace for this match only. Defaults to the lineup's ace; click another runner to record them instead, without changing the lineup.">A</button><span class="nm" title="${esc(UBY[e.id].n + " · " + UBY[e.id].t)}">${esc(UBY[e.id].n)}</span>
        <input class="mini pl" inputmode="numeric" placeholder="#" data-tt="pl" data-j="${j}" value="${fmt(e.pl || "")}">
        <input class="mini" inputmode="numeric" placeholder="Score" data-tt="sc" data-j="${j}" value="${fmt(e.sc)}"></div>` : "").join("")}</div>`).join("")}</div>
      <div class="row" style="margin-top:10px"><button class="primary" data-act="ttsave">${edit ? "Save" : "Add"}</button>${edit ? `<button class="small" data-act="ttcancel">Cancel</button>` : ""}</div>`
      : `<div class="muted">Lineup incomplete</div>`}${msgText ? `<div class="err">${esc(msgText)}</div>` : ""}`;
}
function ttSave() {
  const R = root.tt.rounds, edit = UI.ttEdit != null && R[UI.ttEdit];
  const src = edit ? edit.e : DISTS.flatMap((d, di) => root.tt.lineup[di].map(id => ({id, di})));
  const val = (k, j) => { const el = view.querySelector(`input[data-tt="${k}"][data-j="${j}"]`); return el ? el.value.replace(/[,\s]/g, "") : ""; };
  const ace = j => view.querySelector(`button[data-act="ttace"][data-j="${j}"]`).classList.contains("on") ? 1 : 0;
  const e = src.map((x, j) => ({id: x.id, di: x.di, sc: Math.round(+val("sc", j)), pl: Math.round(+val("pl", j)), v: edit ? (x.v || 1) : curV(x.id), a: ace(j)}));
  const bad = e.filter(x => !(x.sc > 0) || !(x.pl >= 1 && x.pl <= 18)).length;
  if (bad) { drawTtEntry(`${bad} of 15 rows need a score and a placement.`); return; }
  if (edit) edit.e = e; else R.push({t: Date.now(), e});
  UI.ttEdit = null; save(); drawTrials();
}

/* ---------------- events ---------------- */
function redraw() { show(); }
function onClick(e) {
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const st = {t: "tSort", s: "sSort", tt: "ttSort"}[th.dataset.tab], k = th.dataset.sort;
    // First click: names, races, placings and replace rank ascend; figures descend.
    // Same column again flips it; a new column becomes the main sort and the old ones stay behind it.
    const cur = UI[st];
    UI[st] = cur[0][0] === k ? [[k, -cur[0][1]], ...cur.slice(1)]
      : [[k, ["name", "type", "race", "place", "rank"].includes(k) ? 1 : -1], ...cur.filter(x => x[0] !== k)].slice(0, SORT_DEPTH);
    ({t: drawTrainees, s: drawSupports, tt: drawTrials})[th.dataset.tab]();
    return;
  }
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const a = el.dataset.act, id = +el.dataset.id, i = +el.dataset.i;
  const deck = root.decks[i];
  switch (a) {
    case "uinfo": uInfo(UBY[id]); break;
    case "invtr": invTrainees(); break;
    // The Filter button sits inside the section's <summary>; don't let it toggle the section.
    case "pfilt": e.preventDefault(); plannerFilter(); break;
    case "pfall": {
      const own = el.dataset.sec === "own", on = el.dataset.v === "1";
      (own ? ownedUmas() : planTargets()).forEach(u => { root.plan.show[u.id] = on; });
      save(); plannerFilter(); if (tab === "planner") drawPlanner(); break;
    }
    case "ion": {
      const u = UBY[id], on = !invOn(u);
      root.inv.on[id] = on ? 1 : 0;
      el.classList.toggle("on", on); save(); if (tab === "inventory") drawInv(); break;
    }
    case "ionall": {
      const own = el.dataset.sec === "own", on = el.dataset.v === "1";
      invPool().forEach(u => { if (!!root.umas[u.id] === own) root.inv.on[u.id] = on ? 1 : 0; });
      save(); invTrainees(); if (tab === "inventory") drawInv(); break;
    }
    case "utgt": if (root.tgt[id]) delete root.tgt[id]; else root.tgt[id] = 1; save(); drawTrainees(); break;
    case "sinfo": sInfo(SBY[id]); break;
    case "dnew": root.decks.push(normDeck({name: "Deck " + (root.decks.length + 1)})); save(); drawDecks(); break;
    case "dauto": autoDeck(deck); save(); drawDecks(); break;
    case "dclear": deck.cards = [null, null, null, null, null]; deck.friend = null; save(); drawDecks(); break;
    case "dcopy": root.decks.splice(i + 1, 0, normDeck(JSON.parse(JSON.stringify({...deck, name: deck.name + " copy"})))); save(); drawDecks(); break;
    case "ddel": if (confirm(`Delete ${deck.name}?`)) { root.decks.splice(i, 1); save(); drawDecks(); } break;
    case "pinx": root.team.pins.splice(i, 1); save(); drawTeamCtl(); break;
    case "exx": root.team.excl.splice(i, 1); save(); drawTeamCtl(); break;
    case "prx": root.team.prefs.splice(i, 1); save(); drawTeamCtl(); break;
    case "build": UI.team = buildTeams(); UI.teamIdx = Math.max(0, UI.team.teams.indexOf(UI.team.primary)); drawTeamOut(); break;
    case "tview": UI.teamIdx = i; drawTeamOut(); break;
    case "tuse": {
      const R = UI.team, t = R && R.teams[Math.min(UI.teamIdx, R.teams.length - 1)];
      if (!t || t.members.length !== 15) break;
      root.tt.lineup = DISTS.map((d, di) => raceOrder(t, di, t.aces || R.aces).order.map(m => m.u.id));
      UI.ttEdit = null; save(); location.hash = "trials"; break;
    }
    case "ttsave": ttSave(); break;
    case "ttver": { const nv = curV(id) + +el.dataset.d; if (nv > 1) root.tt.ver[id] = nv; else delete root.tt.ver[id]; save(); drawTrials(); break; }
    case "ttcancel": UI.ttEdit = null; drawTrials(); break;
    case "ttchart": ttChart(id, +el.dataset.di, el.dataset.k, el.dataset.r || UI.ttRole); break;
    case "ttrole": UI.ttRole = el.dataset.r; drawTrials(); break;
    // Ace in the lineup: swap the chosen runner into the race's first slot.
    case "ttmkace": { const row = root.tt.lineup[+el.dataset.di], k = +el.dataset.k; if (k) { [row[0], row[k]] = [row[k], row[0]]; save(); drawTrials(); } break; }
    // Ace in the match form: one per race; the form isn't redrawn, so typed values stay.
    case "ttace": view.querySelectorAll(`button[data-act="ttace"][data-di="${el.dataset.di}"]`).forEach(b => b.classList.toggle("on", b === el)); break;
    case "ttsettled": UI.ttSettled = !UI.ttSettled; drawTrials(); break;
    case "ttok": case "ttrev": case "ttundo": {
      const c = ttChanges().find(x => chKey(x) === el.dataset.key);
      if (!c) break;
      if (a === "ttok") root.tt.done[chKey(c)] = "a";
      else if (a === "ttundo") delete root.tt.done[chKey(c)];
      else if (confirm(`Put ${UBY[c.out].n}${c.out === c.in ? ` v${c.ov}` : ""} back in ${DISTS[c.di].n}?`)) ttRevert(c);
      else break;
      save(); drawTrials(); break;
    }
    case "ttedit": UI.ttEdit = i; drawTrials(); $("ttEntry").scrollIntoView({behavior: "smooth", block: "start"}); break;
    case "ttdel":
      if (confirm(`Delete match ${i + 1}?`)) {
        root.tt.rounds.splice(i, 1);
        if (UI.ttEdit === i) UI.ttEdit = null; else if (UI.ttEdit > i) UI.ttEdit--;
        save(); drawTrials();
      }
      break;
    case "hx": root.plan.skills.splice(i, 1); save(); drawHints(); break;
    case "hadd": {
      const n = $("hq").value.trim().toLowerCase();
      const hit = Object.keys(D.skills).find(k => D.skills[k][0].toLowerCase() === n && SUPS.some(s => s.h.includes(+k) || s.e.includes(+k)));
      if (hit && !root.plan.skills.includes(+hit)) root.plan.skills.push(+hit);
      UI.hq = hit ? "" : $("hq").value;
      save(); drawHints(); break;
    }
    case "qa": SUPS.forEach(s => { if (avail(s) && s.r === +el.dataset.r) root.sups[s.id] = {lb: 4}; }); save(); msg("Added."); break;
    case "qu": UMAS.forEach(u => { if (avail(u) && u.r < 3 && !root.umas[u.id]) root.umas[u.id] = {s: u.r, p: 1}; }); save(); msg("Added."); break;
    case "exp": {
      const blob = new Blob([JSON.stringify(root, null, 1)], {type: "application/json"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = `umacalc-${TODAY}.json`; link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000); break;
    }
    case "imp": $("impf").click(); break;
    case "reset":
      if (confirm("Delete ALL Umacalc data: trainees, cards, plans, inventory, teams, Trials matches, decks and settings?\n\nThis can't be undone. Export a backup from Data first if you might want it back.")) {
        root = blank(); UI.team = null; UI.ttEdit = null; save(); show(); msg("All data deleted.");
      }
      break;
    case "wipe": {
      const w = WIPE[el.dataset.k];
      if (w && confirm(`${w[0]}?\n\nThis clears ${w[1]}. Other tabs are untouched.\n\nThis can't be undone.`)) {
        w[2](root); UI.team = null; UI.ttEdit = null; save(); show();
      }
      break;
    }
  }
}
function msg(t, bad) { const m = $("dmsg"); if (m) m.innerHTML = `<div class="${bad ? "err" : "okmsg"}">${esc(t)}</div>`; }
function onChange(e) {
  const el = e.target, a = el.dataset.act, id = el.dataset.id, i = +el.dataset.i, v = el.value;
  if (el.dataset.cfg) { setCfg(el.dataset.cfg, el); return; }
  if (el.id === "impf") {
    const f = el.files[0]; if (!f) return;
    f.text().then(t => {
      try {
        const r = normalize(JSON.parse(t));
        if (!confirm("Replace current data with this backup?")) return;
        root = r; save(); msg(`Imported ${Object.keys(root.umas).length} trainees, ${Object.keys(root.sups).length} cards, ${root.decks.length} decks.`);
      } catch (err) { msg("Not a Umacalc backup: " + err.message, true); }
    });
    return;
  }
  if (el.dataset.tshowall) { UI.tShowAll = v === "1"; $("tfs-show").textContent = showSum(); drawTrainees(); return; }
  if (el.dataset.tshow) {
    const k = el.dataset.tshow;
    UI.tShow = el.checked ? UI.tShow.concat(k) : UI.tShow.filter(x => x !== k);
    $("tfs-show").textContent = showSum(); drawTrainees(); return;
  }
  const tk = el.dataset.tf || el.dataset.tfg || el.dataset.tfa;
  if (tk) {
    const f = UI.tf[tk];
    if (el.dataset.tf) {
      const i = +el.dataset.i;
      f.on = el.checked ? f.on.concat(i) : f.on.filter(x => x !== i);
    } else if (el.dataset.tfg) f.g = v;
    else f.any = v === "1";
    $("tfs-" + tk).textContent = tfSum(TF.find(g => g.k === tk));
    drawTrainees();
    return;
  }
  if (["sType", "sRar", "sOwn"].includes(el.id)) { UI[el.id] = v; drawSupports(); return; }
  const deck = root.decks[i];
  switch (a) {
    case "ustar":
      // Owning a trainee retires its target.
      if (+v) { root.umas[id] = {s: +v, p: (root.umas[id] || {}).p || 1}; delete root.tgt[id]; } else delete root.umas[id];
      save(); drawTrainees(); break;
    case "upot": if (root.umas[id]) root.umas[id].p = +v; save(); break;
    case "pshow": root.plan.show[id] = el.checked; save(); if (tab === "planner") drawPlanner(); break;
    case "uhint": {
      const o = root.umas[id];
      if (!o) break;
      o.h = o.h || {};
      o.h[el.dataset.sk] = +v;
      save(); uInfo(UBY[id]); if (tab === "inventory") drawInv(); break;
    }
    case "slb":
      if (v === "") delete root.sups[id]; else root.sups[id] = {lb: +v};
      save(); drawSupports(); break;
    case "dcard": deck.cards[+el.dataset.j] = v ? +v : null; save(); drawDecks(); break;
    case "dfr": deck.friend = v ? +v : null; save(); drawDecks(); break;
    case "dflb": deck.flb = +v; save(); drawDecks(); break;
    case "dtr": deck.tr = v ? +v : null; save(); drawDecks(); break;
    case "dq": deck.q[el.dataset.t] = Math.max(0, Math.min(5, +v || 0)); save(); break;
    case "pinadd": if (v && !root.team.pins.some(p => UBY[p.id].c === UBY[v].c)) root.team.pins.push({id: +v, d: null, s: null}); save(); drawTeamCtl(); break;
    case "exadd": if (v && !root.team.excl.includes(+v)) root.team.excl.push(+v); save(); drawTeamCtl(); break;
    case "pradd": if (v && !root.team.prefs.includes(+v)) root.team.prefs.push(+v); save(); drawTeamCtl(); break;
    case "pind": root.team.pins[i].d = v === "" ? null : +v; save(); break;
    case "pinace": root.team.pins[i].ace = el.checked; save(); break;
    case "ttl": root.tt.lineup[+el.dataset.di][+el.dataset.k] = v ? +v : null; save(); drawTrials(); break;
    case "ming": root.team.minG = v; UI.team = null; save(); break;
    case "alts": root.team.alts = Math.max(0, Math.min(30, +v || 0)); UI.team = null; save(); break;
    case "pus": root.plan.umas[id] = {...(root.plan.umas[id] || {}), s: +v}; save(); drawPlanner(); break;
    case "pup": root.plan.umas[id] = {...(root.plan.umas[id] || {}), p: +v}; save(); drawPlanner(); break;
    case "puh": {
      const t = root.plan.umas[id] = {...(root.plan.umas[id] || {})};
      t.h = {...(t.h || {})};
      t.h[el.dataset.sk] = +v; save(); drawPlanner(); break;
    }
    case "plb": root.plan.sups[id] = {lb: +v}; save(); drawPlanner(); break;
    case "plv": {
      const s = SBY[id], cap = maxLv(s, own(s).lb);
      root.sups[id].lv = Math.max(1, Math.min(cap, Math.round(+v) || cap));
      if (root.sups[id].lv === cap) delete root.sups[id].lv;
      save(); drawPlanner(); break;
    }
    case "pinv": root.plan.inv[id] = Math.max(0, +v || 0); save(); drawPlanner(); break;
    case "jp": root.set.jp = el.checked; UI.team = null; save(); redraw(); break;
  }
}
function onInput(e) {
  const el = e.target;
  if (el.id === "tq") { UI.tq = el.value; drawTrainees(); }
  else if (el.id === "sq") { UI.sq = el.value; drawSupports(); }
  else if (el.dataset.act === "dname") { root.decks[+el.dataset.i].name = el.value; save(); }
  // Inventory counts update the tables live; the entry fields themselves are never redrawn.
  else if (el.dataset.act === "invn") { root.plan.inv[el.dataset.id] = Math.max(0, Math.round(+el.value) || 0); save(); drawInv(); }
  else if (el.dataset.act === "shv") { root.inv.shards[el.dataset.id] = Math.max(0, Math.round(+el.value) || 0); save(); if (tab === "inventory") drawInv(); }
  else if (el.id === "invq") {
    const q = el.value.trim().toLowerCase();
    document.querySelectorAll("#modalcard tr[data-q]").forEach(tr => { tr.style.display = !q || tr.dataset.q.includes(q) ? "" : "none"; });
  }
}
view.addEventListener("click", onClick);
view.addEventListener("change", onChange);
view.addEventListener("input", onInput);
// Match entry order: all 15 placings first, then all 15 scores. The game shows the finishing
// order before the scores, so that's the order they're typed in. Tab / Shift+Tab and Enter
// follow it; Enter on the last score saves, Tab there moves on to the Add button.
view.addEventListener("keydown", e => {
  const el = e.target;
  if ((e.key !== "Enter" && e.key !== "Tab") || !el.dataset || !el.dataset.tt) return;
  const order = [...view.querySelectorAll('input[data-tt="pl"]'), ...view.querySelectorAll('input[data-tt="sc"]')];
  const i = order.indexOf(el), back = e.key === "Tab" && e.shiftKey;
  if (back ? i === 0 : i === order.length - 1) {
    if (e.key === "Enter") { e.preventDefault(); ttSave(); }
    return;                                      // Tab past either end leaves the form normally
  }
  e.preventDefault();
  order[i + (back ? -1 : 1)].focus();
});
// <details> toggle doesn't bubble; catch it on the way down to remember which filter groups are open.
view.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.k; if (k && UI.tf[k]) UI.tf[k].open = e.target.open; }, true);
// Remember which planner sections are collapsed.
view.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.sec; if (k) { root.plan.open[k] = e.target.open; save(); if (k === "pU" && e.target.open) alignPlanner(); } }, true);
// Filter drop-downs close on a click anywhere else, like a select would.
document.addEventListener("click", e => {
  document.querySelectorAll("details.fgrp[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
});
$("modalcard").addEventListener("click", onClick);
$("modalcard").addEventListener("change", onChange);
$("modalcard").addEventListener("input", onInput);
window.addEventListener("hashchange", go);
// Back-to-top arrow: shown once the page has scrolled a screen's worth.
const totop = $("totop");
const syncTop = () => totop.classList.toggle("on", window.scrollY > window.innerHeight * .6);
window.addEventListener("scroll", syncTop, {passive: true});
totop.addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));

$("foot").innerHTML = `Umacalc ${VERSION}<span class="vbar">|</span>Data and images ${esc(D.built)} from <a href="https://gametora.com/umamusume" target="_blank" rel="noopener">GameTora</a><span class="vbar">|</span>Umamusume: Pretty Derby © Cygames, Inc. Unofficial fan tool.`;
drawBanner();
go();
</script>
