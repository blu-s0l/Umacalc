<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umacalc</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e13; --panel:#11161f; --panel2:#151b26; --line:#212a38; --line2:#2c3646;
  --tx:#e6ebf2; --sub:#9aa6b8; --mut:#697588;
  --blue:#4d9fff; --bluebg:rgba(77,159,255,.10);
  --gold:#b08d3f;
  --green:#2fd583; --greenbg:rgba(47,213,131,.10);
  --red:#f4655f;   --redbg:rgba(244,101,95,.10);
  --amber:#f0a832; --amberbg:rgba(240,168,50,.10);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:22px 18px 80px}
a{color:var(--blue)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px}
.head{font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.muted{color:var(--mut);font-size:12px}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.scroll{overflow-x:auto}
.pos{color:var(--green)} .neg{color:var(--red)}

label,.lbl{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;
           letter-spacing:.08em;margin-bottom:4px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=checkbox]{width:auto;accent-color:var(--blue);margin:0 6px 0 0;vertical-align:middle}
button{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;
  padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--blue);color:#fff}
button.primary{background:var(--blue);border-color:var(--blue);color:#04101f;font-weight:600}
button.primary:hover{background:#69b0ff;color:#04101f}
button.danger{color:var(--red);border-color:rgba(244,101,95,.35)}
button.danger:hover{background:var(--redbg);border-color:var(--red)}
button.small{padding:4px 10px;font-size:12px}
button.x{padding:1px 7px;font-size:12px;color:var(--mut)}
.err{color:var(--red);font-size:12px;margin-top:5px}
.okmsg{color:var(--green);font-size:12px;margin-top:5px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}
.fields>div{display:flex;flex-direction:column}
.fields>div>label{margin-top:auto}

.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.metric .k{font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.metric .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;line-height:1.25}

.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 9px;
      border-radius:999px;text-transform:uppercase}
.pill.info{background:var(--bluebg);color:var(--blue);border:1px solid rgba(77,159,255,.3)}
.pill.warn{background:var(--amberbg);color:var(--amber);border:1px solid rgba(240,168,50,.3)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:13px}
.banner.red{background:var(--redbg);border:1px solid rgba(244,101,95,.4);color:var(--red)}
.banner.amber{background:var(--amberbg);border:1px solid rgba(240,168,50,.4);color:var(--amber)}

.calbox{background:var(--bluebg);border:1px solid rgba(77,159,255,.28);border-radius:11px;padding:12px 15px;margin:0 0 12px}
.calans{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--blue)}
.calsub{font-size:12.5px;color:var(--sub);margin-top:4px}
.calsub b{color:var(--gold);font-weight:700}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;
   padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--mono)}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--blue)}
th.sorted{color:var(--blue)}
tr.off td{opacity:.55}
tr.sel td{color:var(--gold)}
tr.sorted td{background:var(--bluebg)}

.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
       align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modalcard{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
           padding:18px 22px;max-width:740px;width:100%;max-height:86vh;overflow:auto}

.vbar{color:var(--gold);font-weight:700;padding:0 6px}

/* --- app --- */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand span{color:var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a.end{margin-left:auto}
.tt .nm{font-size:14px}
.grow{display:inline-flex;gap:6px;white-space:nowrap}
.grow>span{display:inline-flex;gap:3px;min-width:34px}
.gl{color:var(--mut)}
.gz{color:var(--mut)}
.tfrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
/* filter groups: the summary is the button, the body drops down over the page instead of growing the row */
details.fgrp{position:relative;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);padding:0;margin:0;min-width:140px}
details.fgrp summary{font-size:12.5px;color:var(--sub);padding:7px 10px;border-radius:8px}
details.fgrp:hover{border-color:var(--blue)}
details.fgrp:hover summary{color:var(--tx)}
details.fgrp[open]{border-color:rgba(77,159,255,.5);background:var(--bluebg)}
details.fgrp[open] summary{color:var(--blue)}
.fpop{position:absolute;top:calc(100% + 4px);left:-1px;z-index:30;min-width:calc(100% + 2px);background:var(--panel2);
      border:1px solid rgba(77,159,255,.5);border-radius:8px;padding:4px 10px 10px;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
.fbody{display:flex;gap:4px 12px;margin-top:6px;align-items:center}
select:hover{border-color:var(--blue)}
select:disabled:hover{border-color:var(--line2)}
.ctr{text-align:center}
.mtitle{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.msub{font-size:14px;color:var(--sub);margin-bottom:12px}
.kv{font-size:13px;color:var(--tx);margin-top:4px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mpic{width:96px;height:96px;flex:none;margin:-6px -4px 0 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
table.cmp th,table.cmp td{padding-left:6px;padding-right:6px}
table.cmp .gs{padding-left:16px}
/* target toggle: an empty ring, filled blue when on */
.tgl{width:18px;height:18px;padding:0;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel2);vertical-align:middle}
.tgl:hover{border-color:var(--blue)}
.tgl.on{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--panel2),0 0 0 3px var(--bluebg)}
.row.fill>div{flex:1 1 auto}
.row.fill table{width:100%}
.jpt{font-family:var(--mono);font-size:10.5px;color:var(--sub)}
table.pot th.pl{text-align:center;border-bottom:1px solid var(--line)}
table.pot td:nth-child(even),table.pot th.pl,table.pot tr:last-child th:nth-child(odd){padding-left:16px}
label.ck{display:inline-flex;align-items:center;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;color:var(--tx);margin:0;cursor:pointer}
nav a{padding:6px 12px;border-radius:8px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;border:1px solid transparent}
nav a:hover{color:var(--tx);border-color:var(--line2)}
nav a.on{color:var(--blue);background:var(--bluebg);border-color:rgba(77,159,255,.3)}
select.mini,input.mini{width:auto;padding:3px 6px;font-size:12px;border-radius:6px}
input.mini{width:62px}
.nm{color:var(--tx);cursor:pointer;font-weight:600;text-decoration:none}
.nm:hover{color:var(--blue)}
.ttl{font-size:11px;color:var(--mut)}
.g{display:inline-block;width:18px;text-align:center;font-family:var(--mono);font-weight:700}
.gS{color:var(--gold)} .gA{color:var(--tx)} .gB{color:var(--sub);font-weight:600} .gC{color:var(--mut);font-weight:500}
.gD,.gE,.gF,.gG{color:#465062;font-weight:400}
th.apt span{display:inline-block;width:18px;text-align:center;letter-spacing:0}
td.apt,th.apt{padding-left:4px;padding-right:4px;white-space:nowrap}
.ty{font-family:var(--mono);font-size:11px;color:var(--sub);text-transform:uppercase}
.gold{color:var(--gold)}
.mono{font-family:var(--mono)}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:10px 0}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.slot.fr{border-style:dashed}
.slot select{font-size:12px;padding:5px 6px}
.slot .meta{font-size:11px;color:var(--mut);margin-top:4px;font-family:var(--mono)}
.quota{display:grid;grid-template-columns:repeat(7,minmax(44px,64px));gap:6px}
.quota input{padding:4px 6px;text-align:center;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub)}
.chips .gold{font-weight:600}
.dist td.dh{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
            padding-top:12px;border-bottom:1px solid var(--line2)}
.bench{font-size:11.5px;color:var(--mut)}
.pinrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.pinrow .nm{min-width:180px}
.pinrow select{width:auto}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* planner trainee rows: targets on line 1, hint targets on line 2, items spanning both */
table.ptab tr.pu1 td{border-bottom:0;padding-bottom:2px}
table.ptab tr.pu2 td{padding-top:2px;padding-bottom:10px}
table.ptab td.pitems{vertical-align:top;font-size:12px;line-height:1.55;min-width:220px}
.hrow{display:flex;flex-wrap:wrap;gap:6px 14px}
.hcell{display:flex;flex-direction:column;gap:2px;min-width:110px}
.hcell.off{opacity:.45}
.hcell .ttl{white-space:nowrap}
/* collapsible planner sections: the card header is the toggle; collapsed drops only its trailing margin */
details.sect{border-top:0;padding:0;margin:0}
details.sect>summary.head{font-size:10.5px;color:var(--sub);font-weight:700;margin-bottom:10px}
details.sect>summary.head:hover{color:var(--tx)}
details.sect:not([open])>summary.head{margin-bottom:0}
.igrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.igrid label{text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600;color:var(--sub);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 24px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
table.invt tr.sech td{padding-top:10px;border-bottom:1px solid var(--line2)}
table.invt tr.hr td{padding:6px 0 0;border-bottom:2px solid var(--line2)}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,340px));justify-content:start;gap:18px}
@media(max-width:900px){.split3{grid-template-columns:1fr}}
footer{margin-top:24px}
@media(max-width:900px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:660px){.split{grid-template-columns:1fr}.wrap{padding:16px 12px 60px}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Uma<span>calc</span></div>
    <nav id="nav"></nav>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <footer class="muted" id="foot"></footer>
</div>
<div class="modal" id="modal"><div class="modalcard" id="modalcard"></div></div>
<script src="data.js"></script>
<script>
"use strict";
const VERSION = "0.1";
const D = window.UMA_DATA;
const TODAY = new Date().toISOString().slice(0, 10);
const NOW = Date.now() / 1000;
const KEY = "umacalc.v1", SCHEMA = 1;

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const opts = (list, cur) => list.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(l)}</option>`).join("");
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const fN = v => Math.round(v).toLocaleString();
const day = t => new Date(t * 1000).toISOString().slice(0, 10);

/* ---------------- static data ---------------- */
const UMAS = D.umas, UBY = {};
UMAS.forEach(u => UBY[u.id] = u);
const SUPS = D.sups, SBY = {};
SUPS.forEach(s => SBY[s.id] = s);

const TYPES = [["speed","Spd"],["stamina","Sta"],["power","Pow"],["guts","Gut"],["intelligence","Wit"],["friend","Frd"],["group","Grp"]];
const TYPE_LBL = Object.fromEntries(TYPES);
const RAR = ["", "R", "SR", "SSR"];
const STAT = ["Spd", "Sta", "Pow", "Gut", "Wit"];
const GRADES = "SABCDEFG";
const STAR_SHARDS = [0, 0, 50, 100, 200, 300];     // cost to reach star i from i-1
// Hint level of a potential skill (P2..P5 unlock one each), max Lv3. Cost of each step
// [item, n]: Book 160 / Textbook 161 for normal skills, Rare Book 162 / Rare Textbook 163
// for rare ones, plus Dream Glimmer 44. From JP guides; Monies are left out (only Lv1 is known).
const HINT_MAX = 3;
const HINT_COST = {
  n: [[[160, 4], [44, 5]],  [[160, 8], [44, 10]],  [[161, 6], [44, 15]]],
  r: [[[162, 8], [44, 20]], [[162, 16], [44, 40]], [[163, 12], [44, 60]]],
};
const HINT_ITEMS = [160, 161, 162, 163];
// Hint-able skills: innate ones (open from the start) then potential skills (P2..P5).
// Levels are stored by skill id: {skillId: level}.
const hintSkills = u => u.in.map(sk => ({sk, unlock: 1})).concat(u.aw.map((sk, k) => ({sk, unlock: k + 2})));
const hLv = (h, sk) => (h && h[sk]) || 0;
function hintCost(skill, from, to, into = {}) {
  const steps = HINT_COST[skGold(skill) ? "r" : "n"];
  for (let l = from; l < to; l++) for (const [id, n] of steps[l]) into[id] = (into[id] || 0) + n;
  return into;
}
// Max level a card can reach at each limit break.
const LVCAP = {1: [20,25,30,35,40], 2: [25,30,35,40,45], 3: [30,35,40,45,50]};
// The breakpoints GameTora's effect arrays are keyed on; -1 means "not set here".
const LV_PTS = [1,5,10,15,20,25,30,35,40,45,50];

// Team Trials: five races, three runners each. Aptitude string order is
// Turf Dirt | Sprint Mile Medium Long | Front Pace Late End.
const DISTS = [
  {n: "Sprint", surf: 0, dist: 2, w: [1, 0, 1, .5, .5]},
  {n: "Mile",   surf: 0, dist: 3, w: [1, .2, 1, .3, .6]},
  {n: "Medium", surf: 0, dist: 4, w: [1, .6, .8, .3, .5]},
  {n: "Long",   surf: 0, dist: 5, w: [.8, 1.2, .6, .4, .5]},
  {n: "Dirt",   surf: 1, dist: 3, w: [1, .2, 1.2, .4, .4]},
];
const STYLES = [{n: "Front", i: 6}, {n: "Pace", i: 7}, {n: "Late", i: 8}, {n: "End", i: 9}];

// How much a grade costs, roughly as how hard it is to raise to A by inheritance.
// One B is a single common spark away, so it's cheap; C needs the same aptitude raised
// twice and is much harder.
const GMULT = {S: 1.03, A: 1, B: .93, C: .6, D: .3, E: 0, F: 0, G: 0};
// Every further aptitude that needs fixing costs this on top, because the parents then
// have to carry several different sparks at once. Two Bs ≈ .74, three ≈ .58, B+C ≈ .47.
const EXTRA_FIX = .85;
// A preferred trainee wins a slot it is within this many points of; worth about one B.
const PREF_BONUS = 8;

// Rough per-unit value of each support effect, for ranking cards against each other.
// Friendship and training effectiveness dominate; a flat stat bonus is worth a few points.
const W = {1:1, 2:.2, 3:4, 4:4, 5:4, 6:4, 7:4, 8:1.2, 9:.05, 10:.05, 11:.05, 12:.05, 13:.05,
           14:.15, 15:.5, 16:.02, 17:1.5, 18:.08, 19:.15, 25:.1, 26:.1, 27:.1, 28:.15, 30:.3, 31:2, 32:.02, 41:4};
const COND_UNIQUE = 6;   // conditional unique effects aren't modelled; credit them flat
const EFF_PCT = new Set([1,2,8,15,16,18,25,26,27,28]);

/* ---------------- state ---------------- */
function blank() {
  return {schema: SCHEMA, umas: {}, tgt: {}, sups: {}, decks: [], inv: {on: {}, shards: {}},
          team: {pins: [], prefs: [], excl: [], minG: "B", alts: 8},
          plan: {umas: {}, sups: {}, inv: {}, skills: [], only: false, open: {}},
          set: {jp: false}};
}
function normDeck(d) {
  d.name = d.name || "Deck";
  if (!Array.isArray(d.cards)) d.cards = [];
  d.cards = d.cards.slice(0, 5);
  while (d.cards.length < 5) d.cards.push(null);
  if (d.friend === undefined) d.friend = null;
  if (d.flb == null) d.flb = 4;
  if (d.tr === undefined) d.tr = null;
  if (!d.q) d.q = {speed: 2, stamina: 1, power: 1, guts: 0, intelligence: 1, friend: 0, group: 0};
  return d;
}
function normalize(r) {
  const b = blank();
  if (!r || typeof r !== "object") r = {};
  for (const k in b) {
    if (r[k] == null || typeof r[k] !== typeof b[k] || Array.isArray(r[k]) !== Array.isArray(b[k])) r[k] = b[k];
  }
  for (const k of ["team", "plan", "set", "inv"]) for (const kk in b[k]) if (r[k][kk] == null) r[k][kk] = b[k][kk];
  r.decks.forEach(normDeck);
  for (const id in r.tgt) if (r.umas[id]) delete r.tgt[id];
  // Hint levels were briefly stored as a 4-slot array of potential skills; now {skillId: lv}.
  for (const src of [r.umas, r.plan.umas]) for (const id in src) {
    const x = src[id], u = UBY[id];
    if (x && Array.isArray(x.h)) x.h = u ? Object.fromEntries(u.aw.map((sk, k) => [sk, x.h[k] || 0]).filter(e => e[1])) : {};
  }
  r.schema = SCHEMA;
  return r;
}
let saveErr = "", loadNote = "";
function load() {
  try {
    const s = localStorage.getItem(KEY);
    return normalize(s ? JSON.parse(s) : null);
  } catch (e) {
    saveErr = "Browser storage is unavailable (" + e.message + "). Changes will not survive a reload — export a backup from Data.";
    return normalize(null);
  }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(root));
    if (saveErr) { saveErr = ""; drawBanner(); }
    return true;
  } catch (e) {
    saveErr = "Not saved — browser storage refused the write (" + e.message + "). Export a backup from Data before closing this tab.";
    drawBanner();
    return false;
  }
}
let root = load();
const UI = {tq: "", tOwn: "all", tSort: ["name", 1],
            tf: {surf: {on: [], g: "A", any: false, open: false},
                 dist: {on: [], g: "A", any: false, open: false},
                 sty:  {on: [], g: "A", any: false, open: false}},
            sq: "", sType: "", sRar: "", sOwn: "all", sSort: ["score", -1],
            team: null, teamIdx: 0, hq: ""};

const avail = x => root.set.jp || (!!x.en && x.en <= TODAY);
// Out in JP but not yet on Global: listed on Trainees so it can be targeted, never owned.
const jpOnly = x => !avail(x) && !!x.jp && x.jp <= TODAY;

// Global release estimate. Global works through JP's back catalogue faster than JP
// released it (the gap was ~1580 days at launch and keeps shrinking), so fit Global
// date against JP date over the last year of Global releases and extrapolate.
const DAY = 86400000;
const estGlobal = (() => {
  const pts = UMAS.concat(SUPS).filter(x => x.en && x.jp && x.en <= TODAY).map(x => [Date.parse(x.jp), Date.parse(x.en)]);
  const last = Math.max(...pts.map(p => p[1]));
  const rec = pts.filter(p => p[1] >= last - 365 * DAY);
  const mx = rec.reduce((a, p) => a + p[0], 0) / rec.length, my = rec.reduce((a, p) => a + p[1], 0) / rec.length;
  const b = rec.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / rec.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
  const floor = Date.parse(TODAY) + DAY;
  return jp => new Date(Math.max(floor, my + b * (Date.parse(jp) - mx))).toISOString().slice(0, 10);
})();

/* ---------------- support helpers ---------------- */
function effAt(arr, lv) {
  let pi = -1, ni = -1;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === -1) continue;
    if (LV_PTS[i] <= lv) pi = i; else if (ni < 0) ni = i;
  }
  if (pi < 0) return 0;
  if (LV_PTS[pi] === lv || ni < 0) return arr[pi];
  return Math.floor(arr[pi] + (arr[ni] - arr[pi]) * (lv - LV_PTS[pi]) / (LV_PTS[ni] - LV_PTS[pi]));
}
const maxLv = (s, lb) => LVCAP[s.r][lb];
function supEff(s, lv) {
  const o = {};
  for (const k in s.ef) { const v = effAt(s.ef[k], lv); if (v) o[k] = v; }
  let cond = false;
  if (s.u && lv >= s.u.lv) for (const [t, v] of s.u.ef) {
    if (t < 100) { if (v) o[t] = (o[t] || 0) + v; } else cond = true;
  }
  return {o, cond};
}
function supScore(s, lv) {
  const {o, cond} = supEff(s, lv);
  let t = cond ? COND_UNIQUE : 0;
  for (const k in o) t += (W[k] || 0) * o[k];
  return t;
}
const own = s => root.sups[s.id];
const curLv = s => { const o = own(s); return o ? Math.min(o.lv || maxLv(s, o.lb), maxLv(s, o.lb)) : maxLv(s, 4); };
function ownedSups() { return Object.keys(root.sups).map(id => SBY[id]).filter(s => s && avail(s)); }
const sName = s => `<a class="nm" data-act="sinfo" data-id="${s.id}">${esc(s.n)}</a><div class="ttl">${esc(s.t)}</div>`;
const sLabel = (s, lb) => `${s.n} ${RAR[s.r]}` + (lb != null ? ` LB${lb}` : "") + ` · ${s.t}`;
const statPlus = o => (o[3] || 0) + (o[4] || 0) + (o[5] || 0) + (o[6] || 0) + (o[7] || 0) + (o[41] || 0) * 5;
const skName = id => (D.skills[id] || ["#" + id])[0];
const skGold = id => (D.skills[id] || [0, 1])[1] >= 2;
function banners(b) {

  for (const [t, est] of b) {

  }
  return {last: last ? day(last) : "", next: next ? day(next[0]) + (next[1] ? " est" : "") : ""};
}

function autoDeck(d) {
  const used = new Set();
  const tr = d.tr && UBY[d.tr];
  if (tr) used.add(tr.c);
  const need = {...d.q};
  for (const id of d.cards.concat(d.friend)) {
    const s = id && SBY[id];
    if (!s) continue;
    used.add(s.c);
    if (id !== d.friend) need[s.ty] = (need[s.ty] || 0) - 1;
  }
  const pool = ownedSups().map(s => ({s, sc: supScore(s, curLv(s))})).sort((a, b) => b.sc - a.sc);
  for (let i = 0; i < 5; i++) {
    if (d.cards[i]) continue;
    const pick = pool.find(p => !used.has(p.s.c) && need[p.s.ty] > 0) || pool.find(p => !used.has(p.s.c));
    if (!pick) break;
    d.cards[i] = pick.s.id; used.add(pick.s.c); need[pick.s.ty] = (need[pick.s.ty] || 0) - 1;
  }
  if (!d.friend) {

    const main = TYPES.map(t => t[0]).sort((a, b) => (d.q[b] || 0) - (d.q[a] || 0))[0];
    const best = SUPS.filter(s => avail(s) && s.r === 3 && s.ty === main && !used.has(s.c))
      .map(s => ({s, sc: supScore(s, maxLv(s, d.flb))})).sort((a, b) => b.sc - a.sc)[0];
    if (best) d.friend = best.s.id;

}

function slotFit(u, star, di, si, minG) {
  const d = DISTS[di];
  const g = [u.a[d.surf], u.a[d.dist], u.a[STYLES[si].i]];
  const lim = GRADES.indexOf(minG);
  if (g.some(x => GRADES.indexOf(x) > lim)) return null;
  let m = g.reduce((p, x) => p * GMULT[x], 1);
  const fixes = g.filter(x => GRADES.indexOf(x) > 1).length;
  if (fixes > 1) m *= EXTRA_FIX ** (fixes - 1);
  // A pinned trainee (minG "G") is placed even on an unusable aptitude; it just scores near zero.
  if (m <= 0) { if (minG !== "G") return null; m = .05; }
  // Sparks: grade steps short of A, i.e. how much inheritance it takes to make the slot comfortable.
  const sp = g.reduce((n, x) => n + Math.max(0, GRADES.indexOf(x) - 1), 0);
  const st = uStats(u, star), w = d.w;
  const ws = w.reduce((a, b) => a + b, 0);
  const stat = st.reduce((a, v, i) => a + v * w[i], 0) / ws;          // base stats at owned stars
  const grow = u.g.reduce((a, v, i) => a + v * w[i], 0) / ws;         // growth bonus %
  // Growth outweighs base stats: it multiplies every training gain for the whole career, so a
  // fitting 20% bonus is worth about one B (~5 points). Base stats are a light tiebreak.
  const sc = 100 * m + (stat - 85) / 4 + grow * .6;
  return {sc, g, sp};
}

  };

      // Bonuses steer the solver only; the score shown and summed is f.sc.
      let best = null;

        const w = f && f.sc + (pool.prefs.has(u.id) ? PREF_BONUS : 0);

      const b = new Set(ban); b.add(m.c);
      const r = solveTeam(pool, b);

// A collapsible planner section; open unless the user closed it (root.plan.open).
const sect = (key, head, body) =>
  `<details class="sect" data-sec="${key}"${root.plan.open[key] === false ? "" : " open"}><summary class="head">${head}</summary>${body}</details>`;
// Owned trainee's innate and potential skills with editable hint levels. A potential
// skill whose level isn't reached yet is locked, as in the game.
function hintTable(u, o) {
  const rows = hintSkills(u).map(({sk, unlock}) => {
    const lv = hLv(o.h, sk), locked = o.p < unlock;
    const left = hintCost(sk, lv, HINT_MAX);
    const cost = Object.keys(left).sort((a, b) => a - b).map(id => `${esc(D.items[id] || id)} <span class="gold mono">${left[id]}</span>`).join(" · ");
    return `<tr class="${locked ? "off" : ""}"><td class="mono">${unlock > 1 ? "P" + unlock : "Innate"}</td><td class="${skGold(sk) ? "gold" : ""}">${esc(skName(sk))}</td>
      <td><select class="mini" data-act="uhint" data-id="${u.id}" data-sk="${sk}"${locked ? " disabled" : ""}>${opts([0,1,2,3].map(i => [i, "Lv" + i]), lv)}</select></td>
      <td class="muted">${cost || "—"}</td></tr>`;
  }).join("");
  return `<div class="head" style="margin-top:16px">Skill hints</div>
    <div class="scroll"><table><thead><tr><th>Unlock</th><th>Skill</th><th>Hint</th><th>To Lv3</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function potCost(u, from, to) {
  const tg = D.talent[u.tg] || [], need = {};
  for (let lv = from + 1; lv <= to; lv++) for (const [id, n] of (tg[lv - 2] || [])) need[id] = (need[id] || 0) + n;
  return need;
}
function drawPlanner() {
  const only = root.plan.only;
  // Trainees: stars and potential on the first line, hint-level targets on the second,
  // and one Items cell spanning both with everything that trainee needs.
  const items = {};
  const urows = ownedUmas().sort((a, b) => a.n.localeCompare(b.n) || a.t.localeCompare(b.t)).map(u => {
    const o = root.umas[u.id], p = root.plan.umas[u.id] || {};
    const ts = Math.max(o.s, p.s || o.s), tp = Math.max(o.p, p.p || o.p);
    let shards = 0; for (let i = o.s + 1; i <= ts; i++) shards += STAR_SHARDS[i];
    const need = potCost(u, o.p, tp);
    let hinted = false;
    // A skill can only be targeted once the target potential unlocks it.
    const hcells = hintSkills(u).map(({sk, unlock}) => {
      const c = hLv(o.h, sk), open = tp >= unlock, t = open ? Math.max(c, hLv(p.h, sk)) : c;
      if (t > c) { hinted = true; hintCost(sk, c, t, need); }
      const lo = []; for (let i = c; i <= HINT_MAX; i++) lo.push([i, "Lv" + i]);
      return `<div class="hcell${open ? "" : " off"}"><div class="ttl ${skGold(sk) ? "gold" : ""}">${unlock > 1 ? `<span class="mono">P${unlock}</span> ` : ""}${esc(skName(sk))}</div>
        <select class="mini" data-act="puh" data-id="${u.id}" data-sk="${sk}"${open ? "" : " disabled"}>${opts(lo, t)}</select></div>`;
    }).join("");
    for (const id in need) items[id] = (items[id] || 0) + need[id];
    if (only && ts === o.s && tp === o.p && !hinted) return "";
    const so = []; for (let i = o.s; i <= 5; i++) so.push([i, i + "★"]);
    const po = []; for (let i = o.p; i <= 5; i++) po.push([i, "P" + i]);
    const il = Object.keys(need).sort((a, b) => itemOrder(a) - itemOrder(b))
      .map(id => `<div>${esc(D.items[id] || id)} <span class="gold mono">${need[id]}</span></div>`).join("");
    return `<tr class="pu1"><td>${uName(u)}</td><td class="num">${o.s}★</td><td><select class="mini" data-act="pus" data-id="${u.id}">${opts(so, ts)}</select></td>
      <td class="num">${shards || ""}</td><td class="num">P${o.p}</td><td><select class="mini" data-act="pup" data-id="${u.id}">${opts(po, tp)}</select></td>
      <td class="muted pitems" rowspan="2">${il}</td></tr>
      <tr class="pu2"><td colspan="6"><div class="hrow">${hcells}</div></td></tr>`;
  }).join("");
  $("pU").innerHTML = sect("pU", "Trainees", `<table class="ptab"><thead><tr><th>Trainee</th><th class="num">Stars</th><th>Target</th><th class="num">Shards</th><th class="num">Pot</th><th>Target</th><th>Items</th></tr></thead><tbody>${urows || `<tr><td colspan="7" class="muted">—</td></tr>`}</tbody></table>`);
  // Items: shoes first, then sashes, then the rest.
  const ik = Object.keys(items).sort((a, b) => itemOrder(a) - itemOrder(b));
  $("pI").innerHTML = sect("pI", "Items", `<table><thead><tr><th>Item</th><th class="num">Need</th><th class="num">Have</th><th class="num">Short</th></tr></thead><tbody>
    ${ik.map(id => { const have = root.plan.inv[id] || 0, sh = items[id] - have;
      return `<tr><td>${esc(D.items[id] || id)}</td><td class="num">${fN(items[id])}</td><td class="num"><input class="mini" type="number" min="0" data-act="pinv" data-id="${id}" value="${have || ""}"></td><td class="num ${sh > 0 ? "neg" : "pos"}">${sh > 0 ? fN(sh) : "0"}</td></tr>`; }).join("") || `<tr><td colspan="4" class="muted">—</td></tr>`}</tbody></table>`);
  // Supports: limit breaks and levels.
  let totPts = 0, totCopies = 0;
  const srows = ownedSups().sort((a, b) => b.r - a.r || a.n.localeCompare(b.n)).map(s => {
    const o = own(s), p = root.plan.sups[s.id] || {};
    const tl = Math.max(o.lb, p.lb == null ? o.lb : p.lb), lv = curLv(s), tlv = maxLv(s, tl);
    const pts = Math.max(0, D.exp[s.r][tlv] - D.exp[s.r][lv]), copies = tl - o.lb;
    totPts += pts; totCopies += copies;
    if (only && !pts && !copies) return "";
    const lo = []; for (let i = o.lb; i <= 4; i++) lo.push([i, "LB" + i]);
    return `<tr><td><span class="ty">${RAR[s.r]} ${TYPE_LBL[s.ty]}</span></td><td>${sName(s)}</td><td class="num">LB${o.lb}</td>
      <td class="num"><input class="mini" type="number" min="1" max="${maxLv(s, o.lb)}" data-act="plv" data-id="${s.id}" value="${lv}"></td>
      <td><select class="mini" data-act="plb" data-id="${s.id}">${opts(lo, tl)}</select></td><td class="num">${tlv}</td>
      <td class="num">${copies || ""}</td><td class="num gold">${pts ? fN(pts) : ""}</td></tr>`;
  }).join("");
  $("pS").innerHTML = sect("pS", `Support cards<span class="vbar">|</span>Pts <span class="gold mono">${fN(totPts)}</span><span class="vbar">|</span>Copies <span class="gold mono">${totCopies}</span>`,
    `<table><thead><tr><th>Type</th><th>Card</th><th class="num">LB</th><th class="num">Lv</th><th>Target</th><th class="num">Lv</th><th class="num">Copies</th><th class="num">Pts</th></tr></thead><tbody>${srows || `<tr><td colspan="8" class="muted">—</td></tr>`}</tbody></table>`);
  drawHints();
}
function drawHints() {
  // Hint finder: every card that teaches a skill by hint or event, owned first, with banner dates.

  const blocks = root.plan.skills.map((id, i) => {
    const cards = SUPS.filter(s => s.h.includes(id) || s.e.includes(id))

      .map(s => ({s, o: own(s), via: s.h.includes(id) ? "Hint" : "Event", bn: banners(s.b)}))
      .sort((a, b) => (!!b.o - !!a.o) || ((b.o || {}).lb || 0) - ((a.o || {}).lb || 0) || b.s.r - a.s.r);

      <div class="scroll"><table><thead><tr><th>Type</th><th>Card</th><th>Via</th><th class="num">Owned</th><th>Global</th><th>Last banner</th><th>Next banner</th></tr></thead><tbody>
      ${cards.map(c => `<tr class="${c.o ? "" : "off"}"><td><span class="ty">${RAR[c.s.r]} ${TYPE_LBL[c.s.ty]}</span></td><td>${sName(c.s)}</td><td>${c.via}</td>
        <td class="num">${c.o ? "LB" + c.o.lb : ""}</td><td class="mono">${c.s.en || "—"}</td><td class="mono">${c.bn.last}</td><td class="mono">${c.bn.next}</td></tr>`).join("")}</tbody></table></div></div>`;
  }).join("");
  // Renamed from "Skill hints" now that the hint-level targets have that name.
  $("pH").innerHTML = sect("pH", "Hint sources", `${blocks}
    <div class="row"><div style="width:320px"><input list="skl" id="hq" placeholder="Skill" value="${esc(UI.hq)}"></div><button class="small" data-act="hadd">Add</button></div>
    <datalist id="skl">${names.map(([id, n]) => `<option value="${esc(n)}"></option>`).join("")}</datalist>`);
}

/* ---------------- events ---------------- */
function redraw() { VIEWS[tab](); }
function onClick(e) {
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const st = th.dataset.tab === "t" ? "tSort" : "sSort", k = th.dataset.sort;
    UI[st] = UI[st][0] === k ? [k, -UI[st][1]] : [k, k === "name" || k === "type" ? 1 : -1];
    th.dataset.tab === "t" ? drawTrainees() : drawSupports();
    return;
  }
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const a = el.dataset.act, id = +el.dataset.id, i = +el.dataset.i;
  const deck = root.decks[i];
  switch (a) {
    case "uinfo": uInfo(UBY[id]); break;
    case "invtr": invTrainees(); break;
    case "ion": {
      const u = UBY[id], on = !invOn(u);
      root.inv.on[id] = on ? 1 : 0;
      el.classList.toggle("on", on); save(); if (tab === "inventory") drawInv(); break;
    }
    case "ionall": {
      const own = el.dataset.sec === "own", on = el.dataset.v === "1";
      invPool().forEach(u => { if (!!root.umas[u.id] === own) root.inv.on[u.id] = on ? 1 : 0; });
      save(); invTrainees(); if (tab === "inventory") drawInv(); break;
    }
    case "utgt": if (root.tgt[id]) delete root.tgt[id]; else root.tgt[id] = 1; save(); drawTrainees(); break;
    case "sinfo": sInfo(SBY[id]); break;
    case "dnew": root.decks.push(normDeck({name: "Deck " + (root.decks.length + 1)})); save(); drawDecks(); break;
    case "dauto": autoDeck(deck); save(); drawDecks(); break;
    case "dclear": deck.cards = [null, null, null, null, null]; deck.friend = null; save(); drawDecks(); break;
    case "dcopy": root.decks.splice(i + 1, 0, normDeck(JSON.parse(JSON.stringify({...deck, name: deck.name + " copy"})))); save(); drawDecks(); break;
    case "ddel": if (confirm(`Delete ${deck.name}?`)) { root.decks.splice(i, 1); save(); drawDecks(); } break;
    case "pinx": root.team.pins.splice(i, 1); save(); drawTeamCtl(); break;
    case "exx": root.team.excl.splice(i, 1); save(); drawTeamCtl(); break;
    case "prx": root.team.prefs.splice(i, 1); save(); drawTeamCtl(); break;
    case "build": UI.team = buildTeams(); UI.teamIdx = 0; drawTeamOut(); break;
    case "tview": UI.teamIdx = i; drawTeamOut(); break;
    case "hx": root.plan.skills.splice(i, 1); save(); drawHints(); break;
    case "hadd": {
      const n = $("hq").value.trim().toLowerCase();
      const hit = Object.keys(D.skills).find(k => D.skills[k][0].toLowerCase() === n && SUPS.some(s => s.h.includes(+k) || s.e.includes(+k)));
      if (hit && !root.plan.skills.includes(+hit)) root.plan.skills.push(+hit);
      UI.hq = hit ? "" : $("hq").value;
      save(); drawHints(); break;
    }
    case "qa": SUPS.forEach(s => { if (avail(s) && s.r === +el.dataset.r) root.sups[s.id] = {lb: 4}; }); save(); msg("Added."); break;
    case "qu": UMAS.forEach(u => { if (avail(u) && u.r < 3 && !root.umas[u.id]) root.umas[u.id] = {s: u.r, p: 1}; }); save(); msg("Added."); break;
    case "exp": {
      const blob = new Blob([JSON.stringify(root, null, 1)], {type: "application/json"});
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = `umacalc-${TODAY}.json`; link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000); break;
    }
    case "imp": $("impf").click(); break;
    case "reset": if (confirm("Erase all trainees, cards, decks and plans?")) { root = blank(); save(); msg("Reset."); } break;
  }
}
function msg(t, bad) { const m = $("dmsg"); if (m) m.innerHTML = `<div class="${bad ? "err" : "okmsg"}">${esc(t)}</div>`; }
function onChange(e) {
  const el = e.target, a = el.dataset.act, id = el.dataset.id, i = +el.dataset.i, v = el.value;
  if (el.id === "impf") {
    const f = el.files[0]; if (!f) return;
    f.text().then(t => {
      try {
        const r = normalize(JSON.parse(t));

      } catch (err) { msg("Not a Umacalc backup: " + err.message, true); }

    case "slb":

      save(); drawSupports(); break;
    case "dcard": deck.cards[+el.dataset.j] = v ? +v : null; save(); drawDecks(); break;
    case "dfr": deck.friend = v ? +v : null; save(); drawDecks(); break;
    case "dflb": deck.flb = +v; save(); drawDecks(); break;
    case "dtr": deck.tr = v ? +v : null; save(); drawDecks(); break;
    case "dq": deck.q[el.dataset.t] = Math.max(0, Math.min(5, +v || 0)); save(); break;
    case "pinadd": if (v && !root.team.pins.some(p => UBY[p.id].c === UBY[v].c)) root.team.pins.push({id: +v, d: null, s: null}); save(); drawTeamCtl(); break;
    case "exadd": if (v && !root.team.excl.includes(+v)) root.team.excl.push(+v); save(); drawTeamCtl(); break;
    case "pradd": if (v && !root.team.prefs.includes(+v)) root.team.prefs.push(+v); save(); drawTeamCtl(); break;
    case "pind": root.team.pins[i].d = v === "" ? null : +v; save(); break;
    case "pins": root.team.pins[i].s = v === "" ? null : +v; save(); break;
    case "ming": root.team.minG = v; save(); break;
    case "alts": root.team.alts = Math.max(0, Math.min(30, +v || 0)); save(); break;
    case "ponly": root.plan.only = el.checked; save(); drawPlanner(); break;
    case "pus": root.plan.umas[id] = {...(root.plan.umas[id] || {}), s: +v}; save(); drawPlanner(); break;
    case "pup": root.plan.umas[id] = {...(root.plan.umas[id] || {}), p: +v}; save(); drawPlanner(); break;
    case "puh": {
      const t = root.plan.umas[id] = {...(root.plan.umas[id] || {})};
      t.h = {...(t.h || {})};
      t.h[el.dataset.sk] = +v; save(); drawPlanner(); break;
    }
    case "plb": root.plan.sups[id] = {lb: +v}; save(); drawPlanner(); break;
    case "plv": {
      const s = SBY[id], cap = maxLv(s, own(s).lb);
      root.sups[id].lv = Math.max(1, Math.min(cap, Math.round(+v) || cap));
      if (root.sups[id].lv === cap) delete root.sups[id].lv;
      save(); drawPlanner(); break;
    }
    case "pinv": root.plan.inv[id] = Math.max(0, +v || 0); save(); drawPlanner(); break;
    case "jp": root.set.jp = el.checked; UI.team = null; save(); redraw(); break;
  }
}
function onInput(e) {
  const el = e.target;
  if (el.id === "tq") { UI.tq = el.value; drawTrainees(); }
  else if (el.id === "sq") { UI.sq = el.value; drawSupports(); }
  else if (el.dataset.act === "dname") { root.decks[+el.dataset.i].name = el.value; save(); }
  // Inventory counts update the tables live; the entry fields themselves are never redrawn.
  else if (el.dataset.act === "invn") { root.plan.inv[el.dataset.id] = Math.max(0, Math.round(+el.value) || 0); save(); drawInv(); }
  else if (el.dataset.act === "shv") { root.inv.shards[el.dataset.id] = Math.max(0, Math.round(+el.value) || 0); save(); if (tab === "inventory") drawInv(); }
  else if (el.id === "invq") {
    const q = el.value.trim().toLowerCase();
    document.querySelectorAll("#modalcard tr[data-q]").forEach(tr => { tr.style.display = !q || tr.dataset.q.includes(q) ? "" : "none"; });
  }
}
view.addEventListener("click", onClick);
view.addEventListener("change", onChange);
view.addEventListener("input", onInput);
// <details> toggle doesn't bubble; catch it on the way down to remember which filter groups are open.
view.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.k; if (k && UI.tf[k]) UI.tf[k].open = e.target.open; }, true);
// Remember which planner sections are collapsed.
view.addEventListener("toggle", e => { const k = e.target.dataset && e.target.dataset.sec; if (k) { root.plan.open[k] = e.target.open; save(); } }, true);
// Filter drop-downs close on a click anywhere else, like a select would.
document.addEventListener("click", e => {
  document.querySelectorAll("details.fgrp[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; });
});
$("modalcard").addEventListener("click", onClick);
$("modalcard").addEventListener("change", onChange);
$("modalcard").addEventListener("input", onInput);
window.addEventListener("hashchange", go);

$("foot").innerHTML = `Umacalc ${VERSION}<span class="vbar">|</span>Data and images ${esc(D.built)} from <a href="https://gametora.com/umamusume" target="_blank" rel="noopener">GameTora</a><span class="vbar">|</span>Umamusume: Pretty Derby © Cygames, Inc. Unofficial fan tool.`;
drawBanner();
go();
</script>
